  return BIOMES[bossChapter % BIOMES.length];

function drawTerrariaTree(c, x, groundY, trunkH, b) {
  const P = 2;
  c.fillStyle = '#1b1109';
  c.fillRect(x - 8, groundY - trunkH, 16, trunkH + 40);
  c.fillStyle = '#583101';
  c.fillRect(x - 6, groundY - trunkH, 12, trunkH + 40);
  c.fillStyle = '#7f4f24';
  c.fillRect(x - 4, groundY - trunkH, 4, trunkH + 40);
  c.fillStyle = '#3d2100';
  for (let ty = groundY - trunkH + 4; ty < groundY + 12; ty += 8) {
    c.fillRect(x + 1, ty, 3, 4);
    c.fillRect(x - 5, ty + 3, 2, 3);
  }
  c.fillStyle = '#1b1109';
  c.fillRect(x - 16, groundY - 6, 32, 10);
  c.fillStyle = '#583101';
  c.fillRect(x - 14, groundY - 4, 28, 8);
  c.fillStyle = '#7f4f24';
  c.fillRect(x - 11, groundY - 3, 10, 4);

  const cy = groundY - trunkH - 18;
  const puffs = [
    { dx: 0, dy: -16, r: 22 },
    { dx: -18, dy: -2, r: 18 },
    { dx: 18, dy: -2, r: 18 },
    { dx: -12, dy: -14, r: 16 },
    { dx: 12, dy: -14, r: 16 }
  ];

  c.fillStyle = '#0d1b0e';
  for (let p of puffs) {
    for (let yy = -p.r - P; yy <= p.r + P; yy += P) {
      for (let xx = -p.r - P; xx <= p.r + P; xx += P) {
        if (xx * xx + yy * yy <= (p.r + P) * (p.r + P)) {
          c.fillRect(x + p.dx + xx, cy + p.dy + yy, P, P);
        }
      }
    }
  }
  c.fillStyle = b.leafDark;
  for (let p of puffs) {
    for (let yy = -p.r; yy <= p.r; yy += P) {
      for (let xx = -p.r; xx <= p.r; xx += P) {
        if (xx * xx + yy * yy <= p.r * p.r) {
          c.fillRect(x + p.dx + xx, cy + p.dy + yy, P, P);
        }
      }
    }
  }
  c.fillStyle = b.leafMid;
  for (let p of puffs) {
    for (let yy = -p.r; yy <= p.r - 4; yy += P) {
      for (let xx = -p.r + 2; xx <= p.r - 2; xx += P) {
        if (xx * xx + yy * yy <= (p.r - 2) * (p.r - 2)) {
          c.fillRect(x + p.dx + xx, cy + p.dy + yy, P, P);
        }
      }
    }
  }
  c.fillStyle = b.leafLight;
  for (let p of puffs) {
    for (let yy = -p.r + 2; yy <= -2; yy += P) {
      for (let xx = -p.r + 4; xx <= 4; xx += P) {
        if (xx * xx + yy * yy <= (p.r - 5) * (p.r - 5)) {
          c.fillRect(x + p.dx + xx, cy + p.dy + yy, P, P);
        }
      }
    }
  }
}

function drawPixelCloud(c, x, y, s = 2) {
  const shape = [
    '00001111110000',
    '00111111111100',
    '01111111111110',
    '11111111111111',
    '11111111111111',
    '02222222222220'
  ];
  for (let r = 0; r < shape.length; r++) {
    for (let col = 0; col < shape[r].length; col++) {
      const ch = shape[r][col];
      if (ch === '0') continue;
      c.fillStyle = ch === '1' ? '#ffffff' : '#cbd5e1';
      c.fillRect(x + col * s * 2, y + r * s * 2, s * 2, s * 2);
    }
  }
}

function renderBackgroundCache(biome, isBoss, bossType = 'default') {
  const key = `${biome.name}_${isBoss}_${bossType}`;
  if (cachedBgKey === key) return;
  cachedBgKey = key;

  const bossBands = bossType === 'mogger'
    ? ['#121417', '#1e2229', '#2b303a', '#3b4252', '#4c566a']
    : ['#140004', '#240008', '#3b030d', '#590614', '#730719'];
  const bands = isBoss ? bossBands : biome.skyBands;
  for (let i = 0; i < 5; i++) {
    bgCtx.fillStyle = bands[i];
    bgCtx.fillRect(0, i * 90, 800, 90);
  }

  bgCtx.fillStyle = isBoss ? (bossType === 'mogger' ? 'rgba(255,255,255,0.2)' : 'rgba(230,57,70,0.22)') : 'rgba(255,209,102,0.25)';
  bgCtx.fillRect(658, 24, 64, 64);
  bgCtx.fillStyle = isBoss ? (bossType === 'mogger' ? '#adb5bd' : '#e63946') : '#ff9e00';
  bgCtx.fillRect(666, 32, 48, 48);
  bgCtx.fillStyle = isBoss ? (bossType === 'mogger' ? '#e9ecef' : '#ffba08') : '#ffd166';
  bgCtx.fillRect(670, 36, 40, 40);
  bgCtx.fillStyle = '#ffffff';
  bgCtx.fillRect(676, 42, 28, 28);

  drawPixelCloud(bgCtx, 65, 42, 2);
  drawPixelCloud(bgCtx, 310, 28, 3);
  drawPixelCloud(bgCtx, 515, 58, 2);

  bgCtx.fillStyle = isBoss ? (bossType === 'mogger' ? '#1b1f26' : '#240008') : biome.mtnFar;
  for (let x = 0; x < 800; x += 8) {
    const mh = Math.floor((Math.sin(x * 0.015) * 0.5 + 0.5) * 65 + (Math.cos(x * 0.04) * 18));
    bgCtx.fillRect(x, 225 - mh, 8, mh + 225);
  }

  const horizonY = 296;
  bgCtx.fillStyle = isBoss ? (bossType === 'mogger' ? '#14171c' : '#1c0006') : biome.mtnNear;
  for (let x = 0; x < 800; x += 8) {
    const mh = Math.floor((Math.cos(x * 0.022) * 0.5 + 0.5) * 38 + 20);
    bgCtx.fillRect(x, horizonY - mh, 8, mh + 160);
  }
  bgCtx.fillStyle = isBoss ? (bossType === 'mogger' ? '#0d0f12' : '#120004') : biome.horizonGround;
  bgCtx.fillRect(0, horizonY - 4, 800, 160);

  drawTerrariaTree(bgCtx, 95, horizonY, 54, biome);
  drawTerrariaTree(bgCtx, 235, horizonY, 44, biome);
  drawTerrariaTree(bgCtx, 535, horizonY, 60, biome);
  drawTerrariaTree(bgCtx, 710, horizonY, 48, biome);
}

function drawSkyCameo(biome, isBoss) {
  const t = Date.now() * 0.04;
  const cameos = ['tails', 'samus_ship', 'kirby_star', 'terraria_eye'];
  const type = isBoss ? 'terraria_eye' : cameos[Math.floor(currentLevel / 3) % cameos.length];
  const x = Math.round(((t * 1.1) % 940) - 70);
  const y = Math.round(76 + Math.sin(t * 0.08) * 12);

  ctx.save();
  ctx.translate(x, y);

  if (type === 'tails') {
    const tailSpin = Math.floor(Date.now() / 55) % 2 === 0;
    ctx.fillStyle = '#ff9e00';
    if (tailSpin) {
      ctx.fillRect(-16, -8, 10, 4);
      ctx.fillRect(-16, 2, 10, 4);
    } else {
      ctx.fillRect(-14, -4, 10, 6);
    }
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-16, tailSpin ? -8 : -4, 3, 3);
    ctx.fillStyle = '#ff9e00';
    ctx.fillRect(-6, -3, 12, 8);
    ctx.fillRect(2, -9, 10, 9);
    ctx.fillRect(3, -13, 3, 4);
    ctx.fillRect(8, -13, 3, 4);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(6, -4, 6, 4);
    ctx.fillStyle = '#00bbf9';
    ctx.fillRect(8, -7, 2, 3);
  } else if (type === 'samus_ship') {
    ctx.fillStyle = '#e63946';
    ctx.fillRect(-14, -2, 28, 6);
    ctx.fillStyle = '#ff9e00';
    ctx.fillRect(-10, -5, 20, 4);
    ctx.fillStyle = '#70e000';
    ctx.fillRect(-4, -6, 8, 3);
    ctx.fillStyle = '#4cc9f0';
    ctx.fillRect(-18, 0, 4, 2);
  } else if (type === 'kirby_star') {
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(-10, 2, 20, 4);
    ctx.fillRect(-6, -1, 12, 8);
    ctx.fillStyle = '#ff758f';
    ctx.fillRect(-5, -8, 10, 9);
    ctx.fillStyle = '#140c07';
    ctx.fillRect(1, -6, 2, 3);
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-8, -6, 14, 12);
    ctx.fillStyle = '#e63946';
    ctx.fillRect(-13, -4, 5, 2);
    ctx.fillRect(-13, 2, 5, 2);
    ctx.fillStyle = '#0077b6';
    ctx.fillRect(2, -3, 4, 6);
  }

  ctx.restore();
}

const CHEST_EXCLUSIVE_SKIN_ID = 8888;

function getSkinById(id) {
  id = Math.max(0, Math.min(TOTAL_SKINS - 1, id));
  if (id === 0) {
    return {
      id: 0, name: 'Guia Terraria', rarity: 'COMUM', rarityColor: '#adb5bd',
      skinTone: '#f1c27d', suit: '#7f5539', accent: '#38b000',
      hat: 'hair', face: 'eyes', back: 'none', shape: 'normal'
    };
  }
  if (id === CHEST_EXCLUSIVE_SKIN_ID) {
    return {
      id: CHEST_EXCLUSIVE_SKIN_ID, name: 'Guardião do Baú Real', rarity: 'EXCLUSIVA BAÚ', rarityColor: '#ffd166',
      skinTone: '#f1c27d', suit: '#6a040f', accent: '#ffd166',
      hat: 'crown', face: 'visor', back: 'cape', shape: 'floating'
    };
  }
  const r1 = seededRandom(id * 1.17 + 3);
  const r2 = seededRandom(id * 2.31 + 7);
  const r3 = seededRandom(id * 3.79 + 11);
  const r4 = seededRandom(id * 5.13 + 19);
  const r5 = seededRandom(id * 7.41 + 23);
  const pName = SKIN_PREFIXES[Math.floor(r1 * SKIN_PREFIXES.length)];
  const sName = SKIN_SUFFIXES[Math.floor(r2 * SKIN_SUFFIXES.length)];
  const name = `${pName} ${sName} #${id}`;
  let rarity = 'COMUM', rarityColor = '#adb5bd', shape = 'normal';
  if (id >= 9000) { rarity = 'MÍTICA'; rarityColor = '#ff007f'; shape = r3 > 0.5 ? 'floating' : 'mech'; }
  else if (id >= 7000) { rarity = 'LENDÁRIA'; rarityColor = '#ffd166'; shape = SHAPES[1 + Math.floor(r3 * (SHAPES.length - 1))]; }
  else if (id >= 4500) { rarity = 'ÉPICA'; rarityColor = '#c77dff'; shape = r3 > 0.4 ? 'agile' : 'heavy'; }
  else if (id >= 2000) { rarity = 'RARA'; rarityColor = '#4cc9f0'; shape = r3 > 0.7 ? 'agile' : 'normal'; }
  return {
    id, name, rarity, rarityColor, meme: pName,
    skinTone: SKIN_TONES[Math.floor(r1 * SKIN_TONES.length)],
    suit: SUIT_COLORS[Math.floor(r2 * SUIT_COLORS.length)],
    accent: ACCENT_COLORS[Math.floor(r3 * ACCENT_COLORS.length)],
    hat: HATS[Math.floor(r4 * HATS.length)],
    face: FACES[Math.floor(r5 * FACES.length)],
    back: BACKS[Math.floor(((r1 + r3) % 1) * BACKS.length)],
    shape
  };
}

let audioCtx = null;
let lastAudioTime = 0;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, type, duration, vol = 0.055, slideFreq = null, delay = 0) {
  if (!soundEnabled) return;
  try {
    ensureAudio();
    const now = audioCtx.currentTime + delay;
    if (now - lastAudioTime < 0.015 && delay === 0) return;
    lastAudioTime = now;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, now + duration);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  } catch (e) {}
}

    R(-8, y, 16, 12, '#35527f'); R(-4, y - 6, 8, 6, '#35527f'); O(18, y + 16, 9, 9, '#fff'); R(22, y + 19, 4, 4, '#140c07');
    R(30, y + 34, 22, 3, '#140c07'); R(34, y + 31, 3, 3, '#fff'); R(42, y + 31, 3, 3, '#fff');
    for (let i = 0; i < 3; i++) { const lx = -30 + i * 26 + Math.sin(t * 0.3 + i * 2) * 3; R(lx, y + 42, 7, 8, '#4a6fa5'); O(lx - 4, y + 48, 18, 7, '#e63946'); R(lx - 4, y + 53, 18, 2, '#fff'); }
    ctx.restore();
  }
  if (alive) {
    if (b.hurtTimer > 0) R(x - 4, y - 8, b.w + 8, b.h + 12, 'rgba(255,255,255,0.35)');

    for (const w of b.warn) { if (w.k === 'g') R(w.x - 16, 282, 32, 18, 'rgba(76,201,240,' + (a + 0.2) + ')'); else R(w.x - 14, 0, 28, 300, 'rgba(255,80,80,' + a + ')'); }
    for (const g of b.gey) { O(g.x - 14, 300 - g.h, 28, g.h, '#4cc9f0'); R(g.x - 5, 300 - g.h, 10, g.h, '#fff'); }

function generateLevel(idx) {
  const isBoss = (idx + 1) % 20 === 0;
  const chapter = Math.floor(idx / 20);
  const stageInChapter = idx % 20;
  const biome = getBiomeForLevel(idx);

  const lvl = {
    name: isBoss ? BOSS_TITLES[chapter % BOSS_TITLES.length] : `FASE ${idx + 1} - ${biome.name}`,
    isBoss,
    spawn: { x: 40, y: 255 },
    door: { x: 742, y: 245, w: 28, h: 45, open: true },
    keyItem: null,
    levelChest: null,
    singleProp: null,
    platforms: [],
    spikes: [],
    saws: [],
    springs: [],
    cannons: [],
    darts: [],
    fallingRocks: [],
    boss: null
  };

  if (isBoss) {
    lvl.platforms.push({ x: 0, y: 300, w: 800, h: 150, type: 'solid' });
    lvl.platforms.push({ x: 95, y: 222, w: 120, h: 16, type: 'solid' });
    lvl.platforms.push({ x: 585, y: 222, w: 120, h: 16, type: 'solid' });
    lvl.platforms.push({ x: 330, y: 168, w: 140, h: 16, type: 'solid' });
    lvl.door.y = 255;
    lvl.door.open = false;

    const isMogger = (chapter === 1); // Capítulo 2 (Fase 40) = Segundo Boss: MOGGER
    lvl.boss = {
      bossType: isMogger ? 'mogger' : 'default',
      x: isMogger ? 560 : 560,
      y: isMogger ? 140 : 125,
      w: isMogger ? 84 : 72,
      h: isMogger ? 160 : 72,
      vx: isMogger ? 1.5 : 2.2,
      vy: 0,
      hp: isMogger ? 1000 : 200,
      maxHp: isMogger ? 1000 : 200,
      phase: 1,
      singlePhase: isMogger,
      state: 'float',
      timer: 55,
      hurtTimer: 0,
      animPhase: 0,
      castingTimer: 0,
      chinStrokeTimer: 0,
      armPunch: { active: false, progress: 0, dir: -1, y: 230, hitDone: false },
      projectiles: [],
      minions: [],
      lightnings: []
    };
    if (chapter >= 2) {
      const mm = MEMES[(chapter - 2) % MEMES.length];
      Object.assign(lvl.boss, { bossType: 'meme', meme: mm.id, w: mm.w, h: mm.h, x: 560, y: 300 - mm.h, hp: 800, maxHp: 800,
        singlePhase: true, mp: [], warn: [], gey: [], st: 'idle', atk: false, vx: 1.6, vx2: 3, vy2: 2, timer: 70 });
      lvl.name = mm.name;
    }
    return lvl;
  }

  let diffLevel = 1;
  if (currentDifficulty === 'medium') diffLevel = 2;
  else if (currentDifficulty === 'hard') diffLevel = 3;
  else if (currentDifficulty === 'impossible') diffLevel = 4;

  const s = (n) => seededRandom((idx + 1) * 97 + n * 31 + diffLevel * 13);
  let curX = 0;
  let curY = 290;

  const startW = 115 + Math.floor(s(1) * 35);
  lvl.platforms.push({ x: curX, y: curY, w: startW, h: 450 - curY, type: 'solid' });
  curX += startW;

  const numSegments = diffLevel === 1 ? 4 : (diffLevel === 2 ? 5 : 6);
  let lastUnstable = false;
  for (let i = 0; i < numSegments; i++) {
    const gapMin = diffLevel === 1 ? 36 : (diffLevel === 2 ? 48 : 56);
    const gapMax = diffLevel === 1 ? 62 : (diffLevel === 2 ? 78 : 90);
    const gap = Math.floor(gapMin + s(10 + i) * (gapMax - gapMin));
    curX += gap;

    let dy = Math.floor((s(20 + i) - 0.5) * (diffLevel === 1 ? 48 : 80));
    let nextY = Math.max(150, Math.min(340, curY + dy));
    const rise = curY - nextY;
    if (rise > 0 && gap > 104 - rise) curX -= gap - Math.max(36, 104 - rise);

    if (curY - nextY > 56 && diffLevel >= 2 && lvl.platforms.length > 0) {
      const prevPlat = lvl.platforms[lvl.platforms.length - 1];
      if (prevPlat.type === 'solid' && prevPlat.w >= 40) {
        lvl.springs.push({ x: prevPlat.x + prevPlat.w - 28, y: prevPlat.y - 12, w: 22, h: 12, bounceAnim: 0 });
      }
    }
    curY = nextY;

    const remaining = 690 - curX;
    if (remaining < 70) break;
    const platW = Math.min(remaining, Math.floor(68 + s(30 + i) * (diffLevel === 1 ? 65 : 48)));

    let pType = 'solid';
    if (diffLevel >= 2 && s(40 + i) > 0.72 && platW <= 115) pType = 'moving';
    else if (diffLevel >= 2 && s(40 + i) < 0.22 && platW <= 105) pType = 'crumble';
    else if (diffLevel >= 3 && s(45 + i) > 0.80 && platW <= 105) pType = 'blink';

    if (pType !== 'solid' && lastUnstable) pType = 'solid';
    lastUnstable = pType !== 'solid';
    const platObj = {
      x: curX, y: curY, w: platW, h: pType === 'solid' ? (450 - curY) : 18,
      type: pType,
      baseX: curX, baseY: curY,
      moveRange: pType === 'moving' ? (18 + Math.floor(s(50 + i) * 10)) : 0,
      moveSpeed: pType === 'moving' ? (0.025 + s(55 + i) * 0.025) : 0,
      moveAxis: s(58 + i) > 0.5 ? 'x' : 'y',
      phase: s(60 + i) * Math.PI * 2,
      crumbleTimer: 0,
      fallen: false,
      blinkTimer: Math.floor(s(65 + i) * 180)
    };
    lvl.platforms.push(platObj);

    if (pType === 'solid' && platW >= 58 && i % 3 === 1) {
      const hazardRoll = s(70 + i);
      if (hazardRoll < 0.4 + diffLevel * 0.05) {
        const spikeW = platW >= 100 && diffLevel >= 3 ? 32 : 16;
        const spikeX = curX + Math.floor((platW - spikeW) / 2);
        const isHidden = diffLevel >= 4 && s(75 + i) > 0.7;
        lvl.spikes.push({ x: spikeX, y: curY - 12, w: spikeW, h: 12, hidden: isHidden, triggered: false, triggerDist: 42 });
      } else if (diffLevel >= 2 && hazardRoll > 0.72) {
        lvl.saws.push({
          x: curX + platW / 2, y: curY - 12, r: 12,
          minX: curX + 12, maxX: curX + platW - 12,
          vx: (1.0 + diffLevel * 0.35) * (s(80 + i) > 0.5 ? 1 : -1)
        });
      }

      if (diffLevel >= 4 && s(85 + i) > 0.7) {
        lvl.fallingRocks.push({
          x: curX + Math.floor(platW / 2) - 8, y: 24, w: 16, h: 20,
          vy: 0, state: 'idle', timer: 0
        });
      }
    }
    curX += platW;
  }

  const finalGap = Math.max(36, Math.min(82, 705 - curX));
  const endX = Math.min(705, curX + finalGap);
  const endY = Math.max(190, Math.min(315, curY + Math.floor((s(90) - 0.5) * 40)));
  lvl.platforms.push({ x: endX, y: endY, w: 800 - endX, h: 450 - endY, type: 'solid' });
  lvl.door.x = endX + 36;
  lvl.door.y = endY - 45;

  lvl.singleProp = {
    x: 82,
    y: 290,
    type: PROP_TYPES[(idx + chapter) % PROP_TYPES.length]
  };

  if (Math.random() < 0.20 && lvl.platforms.length >= 3) {
    const solidPlats = lvl.platforms.filter((p, pi) => pi > 0 && pi < lvl.platforms.length - 1 && p.type === 'solid' && p.w >= 46);
    if (solidPlats.length > 0) {
      const targetPlat = solidPlats[Math.floor(Math.random() * solidPlats.length)];
      lvl.levelChest = {
        x: Math.round(targetPlat.x + targetPlat.w / 2 - 14),
        y: targetPlat.y - 22,
        w: 28,
        h: 22,
        opened: false,
        lidAngle: 0
      };
    }
  }

  if (diffLevel >= 3 && lvl.platforms.length >= 4 && (stageInChapter % 2 === 1)) {
    const keyPlat = lvl.platforms[Math.floor(lvl.platforms.length / 2)];
    lvl.keyItem = { x: keyPlat.x + keyPlat.w / 2, y: keyPlat.y - 26, collected: false };
    lvl.door.open = false;
  }

  if (diffLevel >= 3 && s(95) > 0.7) {
    lvl.cannons.push({
      x: 782, y: endY - 72, w: 18, h: 18,
      timer: 40, interval: diffLevel === 4 ? 150 : 200
    });
  }

  lvl.vents = []; lvl.maces = []; lvl.crystals = [];
  const theme = stageInChapter % 5; lvl.theme = theme;
  const mids = lvl.platforms.filter((p, i) => i > 0 && i < lvl.platforms.length - 1 && p.type === 'solid' && p.w >= 60);
  const free = p => ![...lvl.spikes, ...lvl.saws, ...lvl.fallingRocks].some(o => o.x >= p.x && o.x < p.x + p.w);
  if (theme === 1) lvl.platforms.forEach((p, i) => { if (i > 0 && p.type === 'solid') p.ice = true; });
  if (theme === 2) mids.forEach((p, i) => { if (i % 2 === 0 && free(p) && p.w >= 80) lvl.vents.push({ x: p.x + p.w / 2 - 9, y: p.y, w: 18, t: Math.floor(s(100 + i) * 150), on: false }); });
  if (theme === 3) mids.forEach((p, i) => { if ((i % 2 === 1 || mids.length === 1) && free(p) && p.w >= 90) lvl.maces.push({ ax: p.x + p.w / 2, ay: 60, len: p.y - 106, ph: s(110 + i) * 6.28, sp: 0.035, bx: 0, by: 0 }); });
  if (theme === 4) for (let i = 0; i < lvl.platforms.length - 1; i++) {
    const a = lvl.platforms[i], c = lvl.platforms[i + 1];
    if (a.type === 'moving' || c.type === 'moving') continue;
    const gx = a.x + a.w, gap = c.x - gx;
    if (gap >= 50 && i % 2 === 0) lvl.crystals.push({ x: gx + gap / 2, y: Math.min(a.y, c.y) - 48, t: 0 });
  }
  return lvl;
}

const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;

  if (chestAnim.active) {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (chestAnim.timer < chestAnim.maxTimer - 55) { chestAnim.active = false; sfxClick(); }
    }
    return;
  }
  if (crateAnim.active) {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (crateAnim.timer < crateAnim.maxTimer - 40) { crateAnim.active = false; sfxClick(); }
    }
    return;
  }

  if (e.code === 'KeyP' && screen === 'playing') { paused = !paused; sfxClick(); return; }
  if (e.code === 'Escape') {
    paused = false;
    if (screen === 'playing' || screen === 'difficulty') goMap();
    return;
  }

  if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') {
    if (screen === 'playing') {
      player.jumpBuffer = 6;
      if (!player.grounded && level.isBoss) {
        player.parryTimer = 11;
      }
    } else if (screen === 'title') {
      goMap();
    }
  }

  if ((e.code === 'KeyJ' || e.code === 'KeyZ') && screen === 'playing') {
    tryPlayerShoot(false);
  }
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if ((e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') && player.jumping && player.vy < -3) player.vy *= 0.45;
});
function releaseAll() { for (const k in keys) keys[k] = false; mouse.down = false; if (screen === 'playing') paused = true; }
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left - canvas.clientLeft) * (canvas.width / canvas.clientWidth);
  mouse.y = (e.clientY - rect.top - canvas.clientTop) * (canvas.height / canvas.clientHeight);
  mouse.active = true;
});

window.addEventListener('mouseup', () => {
  mouse.down = false;
});

function spawnParticles(x, y, color, count = 12, speed = 3.5) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 0.8 + Math.random() * speed;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 1.2,
      size: 2 + Math.floor(Math.random() * 3),
      color,
      life: 16 + Math.floor(Math.random() * 14)
    });
  }
}

function spawnFloatingText(x, y, text, color = '#ffd166') {
  floatingTexts.push({ x, y, text, color, life: 42 });
}

function addShockwave(x, y, color = '#ffffff') {
  shockwaves.push({ x, y, r: 4, maxR: 38, color, alpha: 1 });
}

// =========================================================================
// DISPAROS COM MIRA 360° & BLOQUEIO ANTI-SPAM
// =========================================================================
function getAimAngle(useMouse = true) {
  const px = player.x + player.w / 2;
  const py = player.y + 13;
  if (useMouse && mouse.active) {
    return Math.atan2(mouse.y - py, mouse.x - px);
  }
  if (level && level.isBoss && level.boss && level.boss.hp > 0) {
    const bx = level.boss.x + level.boss.w / 2;
    const by = level.boss.y + level.boss.h / 2;
    return Math.atan2(by - py, bx - px);
  }
  return player.facing > 0 ? 0 : Math.PI;
}

function tryPlayerShoot(useMouse = true) {
  if (!level || !level.isBoss || !level.boss || level.boss.hp <= 0) return;
  if (shootCooldown > 0 || deadTimer > 0) return;

  const wep = getActiveWeapon();
  shootCooldown = wep.cooldown;
  weaponRecoil = wep.style === 'cannon' ? 6 : 4;
  muzzleFlashTimer = 4;
  sfxShoot(wep.style);

  const px = player.x + player.w / 2;
  const py = player.y + 13;
  const baseAngle = getAimAngle(useMouse);

  player.facing = Math.cos(baseAngle) >= 0 ? 1 : -1;

  const gunTipX = px + Math.cos(baseAngle) * 18;
  const gunTipY = py + Math.sin(baseAngle) * 18;

  const count = wep.spread || 1;
  const spreadStep = wep.style === 'shotgun' ? 0.14 : 0.08;

  for (let i = 0; i < count; i++) {
    const offsetAngle = (i - (count - 1) / 2) * spreadStep;
    const ang = baseAngle + offsetAngle;
    playerBullets.push({
      x: gunTipX,
      y: gunTipY,
      vx: Math.cos(ang) * wep.speed,
      vy: Math.sin(ang) * wep.speed,
      angle: ang,
      r: wep.style === 'cannon' ? 6 : (wep.style === 'laser' ? 3 : 4),
      damage: wep.damage,
      color: wep.bulletColor,
      style: wep.style,
      homing: wep.id === 14
    });
  }
}

function updatePetCompanion() {
  const pet = getActivePet();
  if (!pet || deadTimer > 0) return;

  companion.bobPhase += 0.09;
  const targetX = player.x + (player.facing > 0 ? -18 : player.w + 18);
  const targetY = player.y - 12 + Math.sin(companion.bobPhase) * 4;
  companion.x += (targetX - companion.x) * 0.14;
  companion.y += (targetY - companion.y) * 0.14;
  if (companion.recoil > 0) companion.recoil -= 0.5;

  if (!level || !level.isBoss || !level.boss || level.boss.hp <= 0) return;

  if (companion.shootTimer > 0) {
    companion.shootTimer--;
    return;
  }

  const b = level.boss;
  let tx = b.x + b.w / 2;
  let ty = b.y + b.h / 2;
  if (b.minions && b.minions.length > 0) {
    let bestDist = 9999;
    for (let m of b.minions) {
      const d = Math.hypot(m.x - companion.x, m.y - companion.y);
      if (d < bestDist) {
        bestDist = d;
        tx = m.x;
        ty = m.y;
      }
    }
  }

  const ang = Math.atan2(ty - companion.y, tx - companion.x);
  companion.shootTimer = pet.cooldown;
  companion.recoil = 3;
  sfxPetShoot();

  petBullets.push({
    x: companion.x,
    y: companion.y,
    vx: Math.cos(ang) * pet.speed,
    vy: Math.sin(ang) * pet.speed,
    r: 3,
    damage: pet.damage,
    color: pet.bulletColor
  });
}

// =========================================================================
// DANO, PARRY, MORTES E VITÓRIA
// =========================================================================
function damagePlayer() {
  if (deadTimer > 0 || enterDoorTimer > 0 || player.invulnTimer > 0) return;

  if (level.isBoss) {
    player.hp--;
    player.invulnTimer = 65;
    shakeTimer = 10;
    sfxPlayerHurt();
    spawnParticles(player.x + 10, player.y + 14, '#e63946', 14, 3.5);
    spawnFloatingText(player.x + 10, player.y - 10, '-1 ❤️', '#ff4d6d');

    if (player.hp <= 0) {
      killPlayer(true);
    }
  } else {
    killPlayer(false);
  }
}

function killPlayer(fromBoss = false) {
  if (deadTimer > 0) return;
  deadTimer = fromBoss ? 90 : 32;
  diedToBoss = fromBoss;
  deaths++;
  shakeTimer = 14;
  saveAllData();
  updateUI();
  sfxDie();
  spawnParticles(player.x + 10, player.y + 14, getActiveSkin().accent, 22, 4.5);
}

function completeLevel() {
  if (enterDoorTimer > 0) return;
  enterDoorTimer = 26;
  sfxWin();

  const diff = getDiffConfig();
  const reward = level.isBoss ? diff.bossReward : diff.normalReward;
  sunflowers += reward;
  const secs = levelTime / 60, bkey = currentLevel + '_' + currentDifficulty;
  const bt = safeJSON('solaris_v5_best', {});
  if (!bt[bkey] || secs < bt[bkey]) {
    const had = !!bt[bkey];
    bt[bkey] = secs;
    try { localStorage.setItem('solaris_v5_best', JSON.stringify(bt)); } catch (e) {}
    if (had) spawnFloatingText(player.x + 10, player.y - 34, 'NOVO RECORDE!', '#70e000');
  }
  spawnFloatingText(player.x + 10, player.y - 16, `+${reward} 🌻`, '#ffd166');

  if (currentLevel === unlockedLevel && unlockedLevel < TOTAL_LEVELS - 1) {
    unlockedLevel++;
  }
  saveAllData();
  updateUI();
}

function rectIntersect(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// =========================================================================
// LÓGICA DOS BOSSES: CHEFE 1 (3 FASES) & CHEFE 2 "MOGGER" (1000 HP, FASE ÚNICA)
// =========================================================================
const CLONE_PALETTES = [
  { main: '#00f5d4', shade: '#00bbf9', highlight: '#ffffff' },
  { main: '#ff007f', shade: '#b5179e', highlight: '#ffccd5' },
  { main: '#70e000', shade: '#38b000', highlight: '#d8f3dc' },
  { main: '#9d4edd', shade: '#5a189a', highlight: '#e0aaff' },
  { main: '#ff5400', shade: '#d00000', highlight: '#ffd166' }
];

function spawnColoredMinions(b, count) {
  for (let i = 0; i < count; i++) {
    const pal = CLONE_PALETTES[(i + Math.floor(Math.random() * 5)) % CLONE_PALETTES.length];
    const startX = 140 + Math.random() * 520;
    b.minions.push({
      x: startX,
      y: 75 + Math.random() * 45,
      vx: (Math.random() > 0.5 ? 1 : -1) * (1.7 + Math.random() * 1.1),
      vy: 0,
      r: 17,
      hp: 8,
      palette: pal,
      type: Math.random() > 0.5 ? 'smile' : 'fangs',
      shootTimer: 70 + Math.floor(Math.random() * 50)
    });
  }
}

function spawnDiagonalLightning(b) {
  const targetX = player.x + 10 + (Math.random() - 0.5) * 90;
  const topX = Math.max(40, Math.min(760, targetX + (Math.random() - 0.5) * 260));
  const botX = Math.max(40, Math.min(760, targetX));
  b.lightnings.push({
    topX, botX,
    warnTimer: 46,
    activeTimer: 14,
    hitDone: false
  });
}

function pointToSegmentDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t * dx;
  const cy = y1 + t * dy;
  return Math.hypot(px - cx, py - cy);
}

function damageBoss(b, dmg, hitX, hitY, isExplosive = false) {
  if (b.hp <= 0) return;
  b.hp -= dmg;
  b.hurtTimer = 5;
  sfxBossHit();
  spawnParticles(hitX, hitY, isExplosive ? '#ff9e00' : '#ffd166', isExplosive ? 14 : 6, 3.2);
  if (isExplosive) {
    addShockwave(hitX, hitY, '#ff9e00');
  }

  if (b.hp <= 0) {
    if (!b.singlePhase && b.phase === 1) {
      b.phase = 2;
      b.hp = 200;
      b.maxHp = 200;
      b.state = 'float';
      b.timer = 45;
      shakeTimer = 18;
      addShockwave(b.x + b.w / 2, b.y + b.h / 2, '#ffd166');
      spawnFloatingText(b.x + b.w / 2, b.y - 20, 'FASE 2: 200 HP • FÚRIA & TROVÕES!', '#ff9e00');
      spawnColoredMinions(b, 2);
      return;
    } else if (!b.singlePhase && b.phase === 2) {
      b.phase = 3;
      b.hp = 200;
      b.maxHp = 200;
      b.state = 'abyssal_idle';
      b.timer = 55;
      b.x = 364;
      b.y = 148;
      b.castingTimer = 45;
      shakeTimer = 28;
      addShockwave(400, 180, '#ff0055');
      spawnParticles(400, 180, '#c9b882', 45, 6);
      spawnFloatingText(400, 75, 'FASE 3: 200 HP • HORROR ABISSAL!', '#ff0055');
      spawnColoredMinions(b, 3);
      return;
    } else {
      b.hp = 0;
      b.minions = [];
      b.lightnings = [];
      b.projectiles = [];
      b.armPunch.active = false;
      knockoutTimer = 95;
      shakeTimer = 25;
      level.door.open = true;
      addShockwave(b.x + b.w / 2, b.y + b.h / 2, '#ffd166');
      spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#ffd166', 45, 6);
      sfxWin();
    }
  }
}

function updateMoggerBoss(b) {
  const cx = b.x + b.w / 2;
  const cy = b.y + b.h / 2;
  const dirToPlayer = (player.x + 10) >= cx ? 1 : -1;

  if (b.chinStrokeTimer > 0) b.chinStrokeTimer--;

  if (b.state === 'float') {
    b.x += b.vx;
    b.y = 140 + Math.sin(Date.now() * 0.003) * 4;
    if (b.x <= 70 || b.x + b.w >= 730) b.vx *= -1;
    b.timer--;

    if (b.timer <= 0) {
      if (Math.random() < 0.52) {
        // Ataque 1: Soco Gigante com o Braço Musculoso
        b.state = 'arm_windup';
        b.timer = 30;
        b.armPunch = {
          active: true,
          progress: 0,
          dir: dirToPlayer,
          y: Math.max(175, Math.min(272, player.y + 10)),
          hitDone: false
        };
      } else {
        // Ataque 2: Passar a mão no queixo ("Moggar") -> Tempestade de Raios!
        b.state = 'mog_chin';
        b.timer = 46;
        b.chinStrokeTimer = 46;
        sfxMogBling();
        spawnFloatingText(cx, b.y - 16, '✨ MOGGING! ✨', '#ffffff');
      }
    }
  } else if (b.state === 'arm_windup') {
    b.timer--;
    if (b.timer <= 0) {
      b.state = 'arm_punch';
      b.timer = 26;
      shakeTimer = 10;
      playTone(140, 'sawtooth', 0.16, 0.08, 55);
    }
  } else if (b.state === 'arm_punch') {
    b.timer--;
    // Estende e recolhe o braço gigante
    if (b.timer > 12) {
      b.armPunch.progress = Math.min(1, b.armPunch.progress + 0.14);
    } else {
      b.armPunch.progress = Math.max(0, b.armPunch.progress - 0.09);
    }

    const reach = b.armPunch.progress * 260;
    const armStartX = cx + b.armPunch.dir * 24;
    const armX = b.armPunch.dir > 0 ? armStartX : armStartX - reach;
    const armW = reach;
    const armY = b.armPunch.y - 18;
    const armH = 36;

    if (!b.armPunch.hitDone && reach > 35) {
      if (rectIntersect(player.x, player.y, player.w, player.h, armX, armY, armW, armH)) {
        b.armPunch.hitDone = true;
        damagePlayer();
      }
    }

    if (b.timer <= 0) {
      b.armPunch.active = false;
      b.state = 'float';
      b.timer = 52;
    }
  } else if (b.state === 'mog_chin') {
    b.timer--;
    if (b.timer === 24) {
      // Invoca vários raios na arena inteira!
      for (let k = 0; k < 5; k++) {
        const rx = 65 + k * 165 + (Math.random() - 0.5) * 65;
        b.lightnings.push({
          topX: Math.max(40, Math.min(760, rx + (Math.random() - 0.5) * 140)),
          botX: Math.max(40, Math.min(760, rx)),
          warnTimer: 40 + k * 4,
          activeTimer: 16,
          hitDone: false
        });
      }
      // Também mira 1 raio direto perto do jogador
      spawnDiagonalLightning(b);
    }
    if (b.timer <= 0) {
      b.state = 'float';
      b.timer = 65;
    }
  }

  for (let i = b.lightnings.length - 1; i >= 0; i--) {
    const lt = b.lightnings[i];
    if (lt.warnTimer > 0) {
      lt.warnTimer--;
      if (lt.warnTimer === 0) {
        sfxLightning();
        shakeTimer = 10;
      }
    } else {
      lt.activeTimer--;
      if (!lt.hitDone) {
        const dist = pointToSegmentDist(player.x + 10, player.y + 14, lt.topX, 0, lt.botX, 300);
        if (dist < 18) {
          lt.hitDone = true;
          damagePlayer();
        }
      }
      if (lt.activeTimer <= 0) b.lightnings.splice(i, 1);
    }
  }

  if (rectIntersect(player.x, player.y, player.w, player.h, b.x + 12, b.y + 10, b.w - 24, b.h - 14)) {
    damagePlayer();
  }
}

function updateBossFight(b) {
  if (b.hurtTimer > 0) b.hurtTimer--;
  b.animPhase += 0.08;
  if (b.castingTimer > 0) b.castingTimer--;

  if (b.meme) { updateMemeBoss(b); return; }
  if (b.bossType === 'mogger') {
    updateMoggerBoss(b);
    return;
  }

  const cx = b.x + b.w / 2;
  const cy = b.y + b.h / 2;

  if (b.phase === 1) {
    if (b.state === 'float') {
      b.x += b.vx;
      b.y = 115 + Math.sin(Date.now() * 0.004) * 20;
      if (b.x <= 60 || b.x + b.w >= 740) b.vx *= -1;
      b.timer--;
      if (b.timer <= 0) {
        const r = Math.random();
        if (r < 0.45) {
          b.state = 'shoot';
          b.timer = 30;
        } else if (r < 0.78) {
          b.state = 'slam_warn';
          b.x = Math.max(60, Math.min(670, player.x - 24));
          b.timer = 32;
        } else {
          spawnColoredMinions(b, 2);
          b.timer = 65;
        }
      }
    } else if (b.state === 'shoot') {
      b.timer--;
      if (b.timer === 15) {
        const baseAng = Math.atan2((player.y + 14) - cy, (player.x + 10) - cx);
        [-0.22, 0, 0.22].forEach((offset, idx) => {
          b.projectiles.push({
            x: cx, y: cy,
            vx: Math.cos(baseAng + offset) * 3.6,
            vy: Math.sin(baseAng + offset) * 3.6,
            r: 8, isPink: idx === 1
          });
        });
      }
      if (b.timer <= 0) { b.state = 'float'; b.timer = 55; }
    } else if (b.state === 'slam_warn') {
      b.timer--;
      if (b.timer <= 0) { b.state = 'slam_drop'; b.vy = 11; }
    } else if (b.state === 'slam_drop') {
      b.y += b.vy;
      if (b.y + b.h >= 300) {
        b.y = 300 - b.h;
        shakeTimer = 12;
        addShockwave(cx, 300, '#ffd166');
        b.state = 'slam_recover';
        b.timer = 26;
      }
    } else if (b.state === 'slam_recover') {
      b.timer--;
      if (b.timer <= 0) { b.y = 115; b.state = 'float'; b.timer = 50; }
    }
  } else if (b.phase === 2) {
    if (b.state === 'float') {
      b.x += b.vx * 1.45;
      b.y = 105 + Math.sin(Date.now() * 0.006) * 24;
      if (b.x <= 55 || b.x + b.w >= 745) b.vx *= -1;
      b.timer--;
      if (b.timer <= 0) {
        const r = Math.random();
        if (r < 0.35) {
          b.state = 'shoot';
          b.timer = 26;
        } else if (r < 0.65) {
          spawnDiagonalLightning(b);
          if (Math.random() < 0.5) spawnDiagonalLightning(b);
          b.timer = 52;
        } else if (r < 0.85) {
          spawnColoredMinions(b, 2);
          b.timer = 55;
        } else {
          b.state = 'slam_warn';
          b.x = Math.max(60, Math.min(670, player.x - 24));
          b.timer = 26;
        }
      }
    } else if (b.state === 'shoot') {
      b.timer--;
      if (b.timer === 18 || b.timer === 8) {
        const baseAng = Math.atan2((player.y + 14) - cy, (player.x + 10) - cx);
        [-0.25, 0, 0.25].forEach((offset, idx) => {
          b.projectiles.push({
            x: cx, y: cy,
            vx: Math.cos(baseAng + offset) * 4.2,
            vy: Math.sin(baseAng + offset) * 4.2,
            r: 8, isPink: idx === 1
          });
        });
      }
      if (b.timer <= 0) { b.state = 'float'; b.timer = 45; }
    } else if (b.state === 'slam_warn') {
      b.timer--;
      if (b.timer <= 0) { b.state = 'slam_drop'; b.vy = 13; }
    } else if (b.state === 'slam_drop') {
      b.y += b.vy;
      if (b.y + b.h >= 300) {
        b.y = 300 - b.h;
        shakeTimer = 14;
        addShockwave(cx, 300, '#ff5400');
        b.state = 'slam_recover';
        b.timer = 22;
      }
    } else if (b.state === 'slam_recover') {
      b.timer--;
      if (b.timer <= 0) { b.y = 105; b.state = 'float'; b.timer = 40; }
    }
  } else if (b.phase === 3) {
    b.x = 364 + Math.sin(Date.now() * 0.0018) * 95;
    b.y = 144 + Math.cos(Date.now() * 0.0025) * 14;
    b.timer--;

    if (b.timer <= 0) {
      b.castingTimer = 40;
      const r = Math.random();
      if (r < 0.36) {
        for (let k = 0; k < 5; k++) {
          const ang = (Math.PI * 0.15) + (k * Math.PI * 0.175);
          b.projectiles.push({
            x: cx, y: cy - 35,
            vx: Math.cos(ang) * 4.1,
            vy: Math.sin(ang) * 4.1,
            r: 8, isPink: k === 2
          });
        }
        b.timer = 55;
      } else if (r < 0.72) {
        spawnDiagonalLightning(b);
        spawnDiagonalLightning(b);
        b.timer = 58;
      } else {
        if (b.minions.length < 4) spawnColoredMinions(b, 2);
        b.timer = 60;
      }
    }
  }

  for (let i = b.minions.length - 1; i >= 0; i--) {
    const m = b.minions[i];
    m.x += m.vx;
    m.vy += 0.25;
    m.y += m.vy;
    if (m.y + m.r >= 300) {
      m.y = 300 - m.r;
      m.vy = -5.5;
    }
    if (m.x - m.r < 30 || m.x + m.r > 770) m.vx *= -1;

    m.shootTimer--;
    if (m.shootTimer <= 0) {
      m.shootTimer = 115;
      const ang = Math.atan2((player.y + 14) - m.y, (player.x + 10) - m.x);
      b.projectiles.push({
        x: m.x, y: m.y,
        vx: Math.cos(ang) * 3.2,
        vy: Math.sin(ang) * 3.2,
        r: 6, isPink: false
      });
    }

    if (rectIntersect(player.x, player.y, player.w, player.h, m.x - m.r + 3, m.y - m.r + 3, m.r * 2 - 6, m.r * 2 - 6)) {
      damagePlayer();
    }
  }

  for (let i = b.lightnings.length - 1; i >= 0; i--) {
    const lt = b.lightnings[i];
    if (lt.warnTimer > 0) {
      lt.warnTimer--;
      if (lt.warnTimer === 0) {
        sfxLightning();
        shakeTimer = 10;
      }
    } else {
      lt.activeTimer--;
      if (!lt.hitDone) {
        const dist = pointToSegmentDist(player.x + 10, player.y + 14, lt.topX, 0, lt.botX, 300);
        if (dist < 18) {
          lt.hitDone = true;
          damagePlayer();
        }
      }
      if (lt.activeTimer <= 0) b.lightnings.splice(i, 1);
    }
  }

  for (let i = b.projectiles.length - 1; i >= 0; i--) {
    const pr = b.projectiles[i];
    pr.x += pr.vx;
    pr.y += pr.vy;
    if (pr.x < -20 || pr.x > 820 || pr.y > 460 || pr.y < -20) {
      b.projectiles.splice(i, 1);
      continue;
    }
    if (rectIntersect(player.x, player.y, player.w, player.h, pr.x - pr.r, pr.y - pr.r, pr.r * 2, pr.r * 2)) {
      if (pr.isPink && player.parryTimer > 0) {
        sfxParry();
        player.vy = -7.5;
        player.parryTimer = 0;
        addShockwave(pr.x, pr.y, '#ff007f');
        spawnFloatingText(pr.x, pr.y - 12, 'PARRY!', '#ff007f');
        damageBoss(b, 20, cx, cy);
        b.projectiles.splice(i, 1);
      } else {
        damagePlayer();
        b.projectiles.splice(i, 1);
      }
    }
  }

  if (rectIntersect(player.x, player.y, player.w, player.h, b.x + 8, b.y + 8, b.w - 16, b.h - 16)) {
    damagePlayer();
  }
}

// UPDATE GERAL (60 FPS)
// =========================================================================
function update() {
  if (chestAnim.active) { chestAnim.timer--; if (chestAnim.timer <= 0) chestAnim.active = false; return; }
  if (crateAnim.active) { crateAnim.timer--; if (crateAnim.timer <= 0) crateAnim.active = false; return; }
  if (screen !== 'playing') return;
  if (paused) return;

  if (shakeTimer > 0) shakeTimer--;
  if (bossBannerTimer > 0) bossBannerTimer--;
  if (knockoutTimer > 0) knockoutTimer--;
  if (spawnAnimTimer > 0) spawnAnimTimer--;
  if (shootCooldown > 0) shootCooldown--;
  if (weaponRecoil > 0) weaponRecoil -= 0.4;
  if (muzzleFlashTimer > 0) muzzleFlashTimer--;
  if (player.invulnTimer > 0) player.invulnTimer--;
  if (player.parryTimer > 0) player.parryTimer--;

  if (mouse.down && level && level.isBoss && shootCooldown === 0) {
    tryPlayerShoot(true);
  } else if ((keys['KeyJ'] || keys['KeyZ']) && level && level.isBoss && shootCooldown === 0) {
    tryPlayerShoot(false);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 0.65; ft.life--;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.r += 2.6; sw.alpha -= 0.06;
    if (sw.alpha <= 0) shockwaves.splice(i, 1);
  }

  if (deadTimer > 0) {
    deadTimer--;
    if (deadTimer === 0) startLevel(currentLevel);
    return;
  }

  if (enterDoorTimer > 0) {
    enterDoorTimer--;
    player.x += (level.door.x + 4 - player.x) * 0.22;
    if (enterDoorTimer === 0) {
      if (currentLevel + 1 < TOTAL_LEVELS) {
        mapPage = Math.floor((currentLevel + 1) / 20);
        startLevel(currentLevel + 1);
      } else {
        goMap();
      }
    }
    return;
  }

  levelTime++;
  for (let p of level.platforms) {
    if (p.type === 'moving') {
      p.phase += p.moveSpeed;
      const prevX = p.x;
      const prevY = p.y;
      if (p.moveAxis === 'x') p.x = p.baseX + Math.sin(p.phase) * p.moveRange;
      else p.y = p.baseY + Math.sin(p.phase) * p.moveRange;
      p.dx = p.x - prevX;
      p.dy = p.y - prevY;

      const onTop = (player.y + player.h >= prevY - 3 && player.y + player.h <= prevY + 8) &&
                    (player.x + player.w > p.x && player.x < p.x + p.w);
      if (onTop && player.vy >= 0) {
        player.y = p.y - player.h;
        player.x += p.dx;
      }
    } else if (p.type === 'crumble' && p.crumbleTimer > 0 && !p.fallen) {
      p.crumbleTimer--;
      if (p.crumbleTimer === 0) {
        p.fallen = true;
        spawnParticles(p.x + p.w / 2, p.y + 8, '#8d5524', 12, 3);
      }
    } else if (p.type === 'blink') {
      p.blinkTimer++;
    }
  }

  for (let sp of level.springs) {
    if (sp.bounceAnim > 0) sp.bounceAnim--;
  }

  for (let cn of level.cannons) {
    cn.timer--;
    if (cn.timer <= 0) {
      cn.timer = cn.interval;
      level.darts.push({ x: cn.x - 10, y: cn.y + 6, w: 12, h: 5, vx: -4.2 });
    }
  }
  for (let i = level.darts.length - 1; i >= 0; i--) {
    const dt = level.darts[i];
    dt.x += dt.vx;
    if (dt.x < -20) { level.darts.splice(i, 1); continue; }
    if (rectIntersect(player.x, player.y, player.w, player.h, dt.x, dt.y, dt.w, dt.h)) {
      damagePlayer();
      level.darts.splice(i, 1);
    }
  }

  for (let rk of level.fallingRocks) {
    if (rk.state === 'idle' && Math.abs((player.x + 10) - (rk.x + 8)) < 36) {
      rk.state = 'shake';
      rk.timer = 18;
    } else if (rk.state === 'shake') {
      rk.timer--;
      if (rk.timer <= 0) rk.state = 'fall';
    } else if (rk.state === 'fall') {
      rk.vy += 0.45;
      rk.y += rk.vy;
      if (rectIntersect(player.x, player.y, player.w, player.h, rk.x + 2, rk.y + 2, rk.w - 4, rk.h - 4)) {
        damagePlayer();
        rk.state = 'broken';
      }
      if (rk.y > 450) rk.state = 'broken';
    }
  }

  const moveLeft = keys['ArrowLeft'] || keys['KeyA'];
  const moveRight = keys['ArrowRight'] || keys['KeyD'];
  let targetVx = 0;
  if (moveLeft) {
    targetVx = -player.speed;
    if (!level.isBoss || !mouse.active) player.facing = -1;
  }
  if (moveRight) {
    targetVx = player.speed;
    if (!level.isBoss || !mouse.active) player.facing = 1;
  }

  player.vx += (targetVx - player.vx) * (player.grounded && player.onIce ? 0.1 : 0.35);
  if (Math.abs(player.vx) < 0.1) player.vx = 0;
  if (Math.abs(player.vx) > 0.4 && player.grounded) player.walkAnim += 0.28;
  else player.walkAnim = 0;

  player.x += player.vx;
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > 800) player.x = 800 - player.w;

  for (let p of level.platforms) {
    if (p.fallen) continue;
    if (p.type === 'blink' && (p.blinkTimer % 180) >= 110) continue;
    if (p.type === 'moving' && (player.y + player.h) <= p.y + 8) continue;
    if (rectIntersect(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
    }
  }

  if (player.grounded) player.coyoteTimer = 6;
  else if (player.coyoteTimer > 0) player.coyoteTimer--;
  if (player.jumpBuffer > 0) player.jumpBuffer--;

  if (player.jumpBuffer > 0 && player.coyoteTimer > 0) {
    player.vy = player.jumpPower;
    player.grounded = false;
    player.coyoteTimer = 0;
    player.jumpBuffer = 0;
    player.squashX = 0.78;
    player.squashY = 1.24;
    sfxJump();
    player.jumping = true;
    spawnParticles(player.x + 10, player.y + player.h, '#d8c8a8', 5, 1.6);
  } else if (player.jumpBuffer > 0 && player.extraJump > 0 && !player.grounded) {
    player.vy = player.jumpPower; player.extraJump = 0; player.jumpBuffer = 0; player.jumping = true;
    sfxSpring(); spawnParticles(player.x + 10, player.y + player.h, '#4cc9f0', 8, 2.5);
  }

  player.vy += 0.44;
  if (player.vy > 10) player.vy = 10;
  player.y += player.vy;

  const wasGrounded = player.grounded;
  player.grounded = false;
  for (let p of level.platforms) {
    if (p.fallen) continue;
    if (p.type === 'blink' && (p.blinkTimer % 180) >= 110) continue;
    if (rectIntersect(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vy >= 0 && (player.y + player.h - player.vy) <= p.y + 8) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
        player.onIce = !!p.ice;
        if (!wasGrounded) { player.squashX = 1.22; player.squashY = 0.8; player.jumping = false; if (player.vy === 0) spawnParticles(player.x + 10, player.y + player.h, '#d8c8a8', 6, 2); }
        if (p.type === 'crumble' && p.crumbleTimer === 0) p.crumbleTimer = 28;
      } else if (player.vy < 0 && (player.y - player.vy) >= p.y + p.h - 8) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  player.squashX += (1 - player.squashX) * 0.22;
  player.squashY += (1 - player.squashY) * 0.22;

  for (let sp of level.springs) {
    if (rectIntersect(player.x, player.y, player.w, player.h, sp.x, sp.y, sp.w, sp.h)) {
      player.vy = -12.6;
      player.grounded = false;
      sp.bounceAnim = 12;
      player.squashX = 0.72;
      player.squashY = 1.32;
      sfxSpring();
      spawnParticles(sp.x + 11, sp.y, '#ffd166', 10, 3);
    }
  }

  if (level.levelChest && !level.levelChest.opened) {
    const ch = level.levelChest;
    if (rectIntersect(player.x, player.y, player.w, player.h, ch.x, ch.y, ch.w, ch.h)) {
      ch.opened = true;
      addShockwave(ch.x + 14, ch.y + 11, '#ffd166');
      spawnParticles(ch.x + 14, ch.y + 11, '#ffd166', 24, 4.2);
      triggerChestReward(`Baú Secreto da Fase ${currentLevel + 1}`);
    }
  }

  if (level.keyItem && !level.keyItem.collected) {
    const k = level.keyItem;
    if (rectIntersect(player.x, player.y, player.w, player.h, k.x - 10, k.y - 10, 20, 20)) {
      k.collected = true;
      level.door.open = true;
      sfxKey();
      addShockwave(k.x, k.y, '#ffd166');
      spawnFloatingText(k.x, k.y - 12, 'PORTAL ABERTO!', '#ffd166');
    }
  }

  for (let s of level.spikes) {
    if (s.hidden && !s.triggered) {
      if (Math.abs((player.x + 10) - (s.x + s.w / 2)) < s.triggerDist && Math.abs(player.y - s.y) < 55) {
        s.triggered = true;
      }
    }
    if (!s.hidden || s.triggered) {
      if (rectIntersect(player.x + 3, player.y + 3, player.w - 6, player.h - 4, s.x + 2, s.y + 2, s.w - 4, s.h - 2)) {
        damagePlayer();
      }
    }
  }

  for (let saw of level.saws) {
    saw.x += saw.vx;
    if (saw.x - saw.r < saw.minX || saw.x + saw.r > saw.maxX) saw.vx *= -1;
    if (rectIntersect(player.x + 2, player.y + 2, player.w - 4, player.h - 4, saw.x - saw.r + 3, saw.y - saw.r + 3, saw.r * 2 - 6, saw.r * 2 - 6)) {
      damagePlayer();
    }
  }

  for (const v of level.vents || []) { v.t = (v.t + 1) % 150; v.on = v.t >= 90 && v.t < 125; if (v.on && rectIntersect(player.x + 3, player.y + 3, player.w - 6, player.h - 6, v.x, v.y - 70, v.w, 70)) damagePlayer(); }
  for (const m of level.maces || []) { m.ph += m.sp; const an = Math.sin(m.ph) * 0.8; m.bx = m.ax + Math.sin(an) * m.len; m.by = m.ay + Math.cos(an) * m.len; if (Math.abs(m.bx - (player.x + 10)) < 20 && Math.abs(m.by - (player.y + 14)) < 24) damagePlayer(); }
  for (const c of level.crystals || []) {
    if (c.t > 0) { c.t--; continue; }
    if (Math.abs(c.x - (player.x + 10)) < 18 && Math.abs(c.y - (player.y + 14)) < 22) { c.t = 240; player.extraJump = 1; sfxKey(); spawnParticles(c.x, c.y, '#4cc9f0', 10, 3); }
  }
  updatePetCompanion();

  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const pb = playerBullets[i];
    if (pb.homing && level.isBoss && level.boss && level.boss.hp > 0) {
      const b = level.boss;
      const desired = Math.atan2((b.y + b.h / 2) - pb.y, (b.x + b.w / 2) - pb.x);
      const spd = Math.hypot(pb.vx, pb.vy);
      pb.vx += (Math.cos(desired) * spd - pb.vx) * 0.08;
      pb.vy += (Math.sin(desired) * spd - pb.vy) * 0.08;
    }
    pb.x += pb.vx;
    pb.y += pb.vy;

    if (pb.x < -20 || pb.x > 820 || pb.y < -20 || pb.y > 460) {
      playerBullets.splice(i, 1);
      continue;
    }
    if (level.isBoss && level.boss && level.boss.hp > 0) {
      const b = level.boss;
      let hitMinion = false;
      for (let mIdx = b.minions.length - 1; mIdx >= 0; mIdx--) {
        const m = b.minions[mIdx];
        if (rectIntersect(pb.x - pb.r, pb.y - pb.r, pb.r * 2, pb.r * 2, m.x - m.r, m.y - m.r, m.r * 2, m.r * 2)) {
          m.hp -= pb.damage;
          spawnParticles(pb.x, pb.y, m.palette.main, 7, 3);
          if (m.hp <= 0) {
            addShockwave(m.x, m.y, m.palette.main);
            b.minions.splice(mIdx, 1);
          }
          playerBullets.splice(i, 1);
          hitMinion = true;
          break;
        }
      }
      if (hitMinion) continue;

      if (rectIntersect(pb.x - pb.r, pb.y - pb.r, pb.r * 2, pb.r * 2, b.x, b.y, b.w, b.h)) {
        const isExplosive = pb.style === 'cannon';
        damageBoss(b, pb.damage, pb.x, pb.y, isExplosive);
        if (isExplosive) {
          for (let mIdx = b.minions.length - 1; mIdx >= 0; mIdx--) {
            const m = b.minions[mIdx];
            if (Math.hypot(m.x - pb.x, m.y - pb.y) < 60) {
              m.hp -= pb.damage * 0.7;
              if (m.hp <= 0) b.minions.splice(mIdx, 1);
            }
          }
        }
        playerBullets.splice(i, 1);
      }
    }
  }

  for (let i = petBullets.length - 1; i >= 0; i--) {
    const ptb = petBullets[i];
    ptb.x += ptb.vx;
    ptb.y += ptb.vy;
    if (ptb.x < -20 || ptb.x > 820 || ptb.y < -20 || ptb.y > 460) {
      petBullets.splice(i, 1);
      continue;
    }
    if (level.isBoss && level.boss && level.boss.hp > 0) {
      const b = level.boss;
      let hitMinion = false;
      for (let mIdx = b.minions.length - 1; mIdx >= 0; mIdx--) {
        const m = b.minions[mIdx];
        if (rectIntersect(ptb.x - ptb.r, ptb.y - ptb.r, ptb.r * 2, ptb.r * 2, m.x - m.r, m.y - m.r, m.r * 2, m.r * 2)) {
          m.hp -= ptb.damage;
          spawnParticles(ptb.x, ptb.y, ptb.color, 4, 2);
          if (m.hp <= 0) b.minions.splice(mIdx, 1);
          petBullets.splice(i, 1);
          hitMinion = true;
          break;
        }
      }
      if (hitMinion) continue;

      if (rectIntersect(ptb.x - ptb.r, ptb.y - ptb.r, ptb.r * 2, ptb.r * 2, b.x, b.y, b.w, b.h)) {
        damageBoss(b, ptb.damage, ptb.x, ptb.y, false);
        petBullets.splice(i, 1);
      }
    }
  }

  if (level.isBoss && level.boss && level.boss.hp > 0) updateBossFight(level.boss);

  if (player.y > 455) killPlayer(false);

  if (level.door.open && rectIntersect(player.x, player.y, player.w, player.h, level.door.x, level.door.y, level.door.w, level.door.h)) {
    completeLevel();
  }
}
// =========================================================================
// REFERÊNCIA GAMER ÚNICA & BAÚ DO TESOURO 16-BIT DE ALTA QUALIDADE

function drawReferenceProp(prop) {
  if (!prop) return;
  const x = Math.round(prop.x);
  const y = Math.round(prop.y);
  const t = Date.now() * 0.005;
  ctx.save();

  if (prop.type === 'mario_block') {
    const bob = Math.round(Math.sin(t) * 2);
    const by = y - 42 + bob;
    ctx.fillStyle = '#140c07';
    ctx.fillRect(x, by, 18, 18);
    ctx.fillStyle = '#ff9e00';
    ctx.fillRect(x + 1, by + 1, 16, 16);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(x + 1, by + 1, 15, 2);
    ctx.fillRect(x + 1, by + 1, 2, 15);
    ctx.fillStyle = '#583101';
    ctx.fillRect(x + 2, by + 2, 2, 2);
    ctx.fillRect(x + 14, by + 2, 2, 2);
    ctx.fillRect(x + 2, by + 14, 2, 2);
    ctx.fillRect(x + 14, by + 14, 2, 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + 6, by + 4, 6, 2);
    ctx.fillRect(x + 10, by + 6, 2, 3);
    ctx.fillRect(x + 8, by + 9, 3, 2);
    ctx.fillRect(x + 8, by + 13, 2, 2);
  } else if (prop.type === 'zelda_triforce') {
    const bob = Math.round(Math.sin(t * 1.2) * 3);
    const ty = y - 28 + bob;
    ctx.fillStyle = '#140c07';
    ctx.fillRect(x - 1, ty + 14, 22, 5);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(x + 8, ty, 4, 3);
    ctx.fillRect(x + 6, ty + 3, 8, 3);
    ctx.fillRect(x + 4, ty + 6, 12, 3);
    ctx.fillRect(x + 4, ty + 9, 4, 3);
    ctx.fillRect(x + 2, ty + 12, 8, 3);
    ctx.fillRect(x, ty + 15, 10, 3);
    ctx.fillRect(x + 12, ty + 9, 4, 3);
    ctx.fillRect(x + 10, ty + 12, 8, 3);
    ctx.fillRect(x + 10, ty + 15, 10, 3);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + 9, ty + 2, 2, 2);
  } else if (prop.type === 'master_sword') {
    ctx.fillStyle = '#140c07';
    ctx.fillRect(x + 2, y - 8, 20, 8);
    ctx.fillStyle = '#6c757d';
    ctx.fillRect(x + 3, y - 7, 18, 6);
    ctx.fillStyle = '#adb5bd';
    ctx.fillRect(x + 5, y - 6, 14, 3);
    ctx.fillStyle = '#e5e5e5';
    ctx.fillRect(x + 10, y - 20, 4, 13);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + 11, y - 20, 1, 12);
    ctx.fillStyle = '#3a0ca3';
    ctx.fillRect(x + 6, y - 22, 12, 3);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(x + 11, y - 22, 2, 2);
    ctx.fillStyle = '#4cc9f0';
    ctx.fillRect(x + 10, y - 27, 4, 5);
  } else if (prop.type === 'minecraft_sword') {
    ctx.fillStyle = '#140c07';
    ctx.fillRect(x + 13, y - 23, 6, 6);
    ctx.fillStyle = '#4cc9f0';
    ctx.fillRect(x + 14, y - 22, 4, 4);
    ctx.fillRect(x + 12, y - 20, 4, 4);
    ctx.fillRect(x + 10, y - 18, 4, 4);
    ctx.fillRect(x + 8, y - 16, 4, 4);
    ctx.fillStyle = '#90e0ef';
    ctx.fillRect(x + 15, y - 21, 2, 2);
    ctx.fillStyle = '#0077b6';
    ctx.fillRect(x + 4, y - 14, 4, 4);
    ctx.fillRect(x + 10, y - 8, 4, 4);
    ctx.fillStyle = '#7f4f24';
    ctx.fillRect(x + 4, y - 8, 4, 4);
    ctx.fillRect(x + 2, y - 6, 4, 4);
  } else if (prop.type === 'sonic_ring') {
    const squeeze = Math.max(2, Math.round(Math.abs(Math.cos(t * 1.6)) * 7));
    const ry = y - 22;
    ctx.fillStyle = '#140c07';
    ctx.fillRect(x + 9 - squeeze, ry - 1, squeeze * 2 + 2, 16);
    ctx.fillStyle = '#ff9e00';
    ctx.fillRect(x + 10 - squeeze, ry, squeeze * 2, 14);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(x + 10 - squeeze + 1, ry + 1, Math.max(1, squeeze * 2 - 2), 12);
    if (squeeze > 3) {
      ctx.fillStyle = '#140c07';
      ctx.fillRect(x + 10 - (squeeze - 3), ry + 3, (squeeze - 3) * 2, 8);
    }
  } else if (prop.type === 'darksouls_bonfire') {
    ctx.fillStyle = '#3d2100';
    ctx.fillRect(x + 2, y - 4, 18, 4);
    ctx.fillStyle = '#adb5bd';
    ctx.fillRect(x + 4, y - 6, 5, 3);
    ctx.fillRect(x + 13, y - 6, 5, 3);
    ctx.fillStyle = '#6c757d';
    ctx.fillRect(x + 10, y - 20, 2, 16);
    ctx.fillRect(x + 7, y - 17, 8, 2);
    const flick = Math.round(Math.sin(t * 3) * 2);
    ctx.fillStyle = '#ff5400';
    ctx.fillRect(x + 5, y - 13 - flick, 12, 9 + flick);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(x + 7, y - 10 - flick, 8, 6 + flick);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + 9, y - 7, 4, 3);
  } else if (prop.type === 'pokeball') {
    const py = y - 14;
    ctx.fillStyle = '#140c07';
    ctx.fillRect(x + 2, py, 14, 14);
    ctx.fillStyle = '#e63946';
    ctx.fillRect(x + 3, py + 1, 12, 5);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + 3, py + 8, 12, 5);
    ctx.fillStyle = '#140c07';
    ctx.fillRect(x + 3, py + 6, 12, 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + 7, py + 5, 4, 4);
  } else if (prop.type === 'terraria_crystal') {
    const pulse = Math.sin(t * 2) > 0 ? '#ff4d6d' : '#ff0055';
    const cy = y - 18;
    ctx.fillStyle = '#140c07';
    ctx.fillRect(x + 2, cy + 2, 14, 12);
    ctx.fillStyle = pulse;
    ctx.fillRect(x + 3, cy + 1, 5, 5);
    ctx.fillRect(x + 10, cy + 1, 5, 5);
    ctx.fillRect(x + 2, cy + 4, 14, 5);
    ctx.fillRect(x + 4, cy + 9, 10, 4);
    ctx.fillRect(x + 7, cy + 13, 4, 3);
    ctx.fillStyle = '#ffccd5';
    ctx.fillRect(x + 4, cy + 2, 2, 2);
  }

  ctx.restore();
}

function drawDetailedChestSprite(c, cx, cy, scale = 1, openRatio = 0) {
  c.save();
  c.translate(Math.round(cx), Math.round(cy));
  c.scale(scale, scale);

  c.fillStyle = 'rgba(0, 0, 0, 0.45)';
  c.fillRect(-16, 10, 32, 4);

  c.fillStyle = '#140c07';
  c.fillRect(-15, -2, 30, 14);
  c.fillStyle = '#583101';
  c.fillRect(-13, 0, 26, 10);
  c.fillStyle = '#7f4f24';
  c.fillRect(-11, 0, 22, 8);
  c.fillStyle = '#3d2100';
  c.fillRect(-5, 0, 1, 10);
  c.fillRect(4, 0, 1, 10);

  c.fillStyle = '#d48c00';
  c.fillRect(-14, 0, 3, 10);
  c.fillRect(11, 0, 3, 10);
  c.fillRect(-14, 8, 28, 3);
  c.fillStyle = '#ffd166';
  c.fillRect(-13, 0, 1, 9);
  c.fillRect(12, 0, 1, 9);

  if (openRatio > 0.05) {
    c.fillStyle = '#ff9e00';
    c.fillRect(-12, -3, 24, 5);
    c.fillStyle = '#ffd166';
    c.fillRect(-10, -4, 20, 4);
    c.fillStyle = '#ffffff';
    c.fillRect(-7, -4, 14, 2);
  }

  const lidLift = Math.round(openRatio * 10);
  const lidShrink = Math.round(openRatio * 3);
  const lidY = -12 - lidLift;
  const lidH = Math.max(5, 11 - lidShrink);

  c.fillStyle = '#140c07';
  c.fillRect(-16, lidY, 32, lidH + 2);
  c.fillStyle = '#7f4f24';
  c.fillRect(-14, lidY + 1, 28, lidH);
  c.fillStyle = '#9c6644';
  c.fillRect(-12, lidY + 2, 24, Math.max(2, lidH - 4));

  c.fillStyle = '#d48c00';
  c.fillRect(-15, lidY + 1, 3, lidH);
  c.fillRect(12, lidY + 1, 3, lidH);
  c.fillRect(-15, lidY + lidH - 1, 30, 2);
  c.fillStyle = '#ffd166';
  c.fillRect(-14, lidY + 1, 28, 2);
  c.fillStyle = '#ffffff';
  c.fillRect(-11, lidY + 1, 8, 1);

  const lockY = -4 - Math.round(lidLift * 0.6);
  c.fillStyle = '#140c07';
  c.fillRect(-4, lockY, 8, 9);
  c.fillStyle = '#ffd166';
  c.fillRect(-3, lockY + 1, 6, 7);
  c.fillStyle = '#e63946';
  c.fillRect(-1, lockY + 3, 2, 3);
  c.fillStyle = '#ffffff';
  c.fillRect(-1, lockY + 3, 1, 1);

  c.restore();
}

function drawLevelChest(ch) {
  if (!ch || ch.opened) return;
  const cx = ch.x + ch.w / 2;
  const cy = ch.y + ch.h / 2;
  const t = Date.now() * 0.006;
  const pulse = Math.sin(t) * 0.5 + 0.5;

  ctx.save();
  ctx.fillStyle = `rgba(255, 209, 102, ${0.18 + pulse * 0.18})`;
  ctx.fillRect(ch.x - 6, ch.y - 6, ch.w + 12, ch.h + 8);

  drawDetailedChestSprite(ctx, cx, cy, 1.0, 0);

  const sparkY = Math.round((t * 14) % 16);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(cx - 8, ch.y - 2 - sparkY, 2, 2);
  ctx.fillStyle = '#ffd166';
  ctx.fillRect(cx + 7, ch.y - 6 - ((sparkY + 7) % 16), 2, 2);
  ctx.restore();
}

function drawPlatformBlock(p, biome) {
  if (p.fallen) return;
  ctx.save();

  if (p.type === 'blink') {
    const cycle = p.blinkTimer % 180;
    const solid = cycle < 110;
    if (!solid) {
      ctx.strokeStyle = '#90e0ef';
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(p.x, p.y, p.w, p.h);
      ctx.restore();
      return;
    }
    if (cycle > 85 && Math.floor(cycle / 3) % 2 === 0) {
      ctx.globalAlpha = 0.45;
    }
    ctx.fillStyle = '#0077b6';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#00bbf9';
    ctx.fillRect(p.x + 2, p.y + 6, p.w - 4, p.h - 8);
    ctx.fillStyle = '#80ffdb';
    ctx.fillRect(p.x, p.y, p.w, 5);
    ctx.restore();
    return;
  }

  if (p.type === 'crumble' && p.crumbleTimer > 0) {
    ctx.translate((Math.random() - 0.5) * 3, 0);
  }

  if (p.type === 'moving') {
    ctx.fillStyle = '#140c07';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#7f4f24';
    ctx.fillRect(p.x + 2, p.y + 2, p.w - 4, p.h - 4);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(p.x + 4, p.y + 3, p.w - 8, 3);
    ctx.fillStyle = '#adb5bd';
    ctx.fillRect(p.x + 6, p.y + 8, 6, 6);
    ctx.fillRect(p.x + p.w - 12, p.y + 8, 6, 6);
    ctx.restore();
    return;
  }

  ctx.fillStyle = '#140c07';
  ctx.fillRect(p.x - 1, p.y - 1, p.w + 2, p.h + 2);
  ctx.fillStyle = biome.dirtBase;
  ctx.fillRect(p.x, p.y, p.w, p.h);

  for (let bx = p.x + 4; bx < p.x + p.w - 6; bx += 12) {
    for (let by = p.y + 13; by < p.y + p.h - 6; by += 12) {
      const hash = ((bx * 17 + by * 31) % 11);
      if (hash < 4) {
        ctx.fillStyle = biome.dirtMid;
        ctx.fillRect(bx, by, 6, 6);
        ctx.fillStyle = biome.dirtDark;
        ctx.fillRect(bx + 2, by + 2, 4, 4);
      } else if (hash < 7) {
        ctx.fillStyle = biome.dirtLight;
        ctx.fillRect(bx + 1, by + 1, 4, 3);
      } else if (hash === 9) {
        ctx.fillStyle = '#140c07';
        ctx.fillRect(bx, by, 5, 5);
        ctx.fillStyle = biome.oreColor;
        ctx.fillRect(bx + 1, by + 1, 3, 3);
      }
    }
  }

  ctx.fillStyle = biome.grassDark;
  ctx.fillRect(p.x, p.y, p.w, 10);
  ctx.fillStyle = biome.grassMid;
  ctx.fillRect(p.x, p.y, p.w, 7);
  ctx.fillStyle = biome.grassTop;
  ctx.fillRect(p.x, p.y, p.w, 3);

  for (let gx = p.x + 2; gx < p.x + p.w - 4; gx += 6) {
    const drop = (gx * 7) % 5;
    ctx.fillStyle = biome.grassMid;
    ctx.fillRect(gx, p.y + 7, 3, drop);
    ctx.fillStyle = biome.grassDark;
    ctx.fillRect(gx, p.y + 7 + drop, 3, 2);
  }

  if (p.type === 'crumble') {
    ctx.fillStyle = '#140c07';
    for (let cx = p.x + 12; cx < p.x + p.w - 12; cx += 20) {
      ctx.fillRect(cx, p.y + 4, 3, 6);
      ctx.fillRect(cx + 2, p.y + 10, 3, 6);
    }
  }
  ctx.restore();
}

// ARTE PIXEL ART DO CHEFE 1 E DO SEGUNDO CHEFE "MOGGER" (1000 HP)
