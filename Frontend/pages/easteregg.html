    ctx.fillRect(-38, -32, 76, 13);
    ctx.strokeRect(-38, -32, 76, 13);

    ctx.fillStyle = '#140c09';
    ctx.fillRect(-10, -24, 20, 17);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(-6, -20, 12, 9);

    if (isWeaponTab) {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('🔫 BOSS', 0, 14);
    }
    ctx.restore();

    ctx.fillStyle = '#e5e5e5';
    ctx.font = 'bold 10px sans-serif';
    const parts = c.desc.split(' • ');
    for (let pIdx = 0; pIdx < parts.length; pIdx++) {
      ctx.fillText(parts[pIdx], cx + cw / 2, cy + 195 + pIdx * 16);
    }

    const canBuy = sunflowers >= c.price;
    ctx.fillStyle = canBuy ? '#52b788' : '#5e3c2e';
    ctx.fillRect(cx + 16, cy + 248, cw - 32, 33);
    ctx.fillStyle = canBuy ? '#140c09' : '#d6c3b3';
    ctx.font = 'bold 13.5px "Arial Black", sans-serif';
    ctx.fillText(`ABRIR: 🌻 ${c.price}`, cx + cw / 2, cy + 269);
  }

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText(
    isWeaponTab
      ? 'As armas sorteadas aparecem automaticamente nas fases de BOSS! Veja seu arsenal em [🔫 ARMAS].'
      : 'Clique em qualquer caixa para sortear uma das 10.000 skins! Veja suas skins em [🎒 SKINS].',
    canvas.width / 2, 422
  );
  ctx.textAlign = 'left';

  drawCrateOpeningAnimation();
}

// =========================================================================
// INVENTÁRIO DE SKINS COM SEPARAÇÃO POR RARIDADE
// =========================================================================
function drawInventoryScreen() {
  drawSolarisBackground(unlockedLevel);

  const filteredData = getFilteredInventorySkins(invRarityFilter);
  const maxPages = Math.max(1, Math.ceil(filteredData.count / 8));

  ctx.fillStyle = C_SOLAR_DARK;
  ctx.fillRect(0, 0, canvas.width, 48);
  ctx.fillStyle = C_SOLAR_ACCENT;
  ctx.font = 'bold 17px "Arial Black", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`🎒 MINHAS SKINS — ${invRarityFilter === 'ALL' ? 'TODAS' : invRarityFilter} (${filteredData.count}) • PÁG ${invPage + 1}/${maxPages}`, canvas.width / 2, 31);

  // Barra de filtro por raridade
  for (let i = 0; i < RARITY_FILTERS.length; i++) {
    const f = RARITY_FILTERS[i];
    const bx = 36 + i * 123;
    const by = 54;
    const bw = 116;
    const bh = 26;
    const isActive = invRarityFilter === f.id;
    const countForTab = getFilteredInventorySkins(f.id).count;

    ctx.fillStyle = isActive ? f.color : '#263849';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = isActive ? '#ffffff' : f.color;
    ctx.lineWidth = isActive ? 2.5 : 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = isActive ? '#140c09' : '#ffffff';
    ctx.font = 'bold 9.5px "Arial Black", sans-serif';
    ctx.fillText(`${f.label} (${countForTab})`, bx + bw / 2, by + 17);
  }

  if (filteredData.count === 0) {
    ctx.fillStyle = 'rgba(20, 12, 9, 0.78)';
    ctx.fillRect(150, 170, 500, 130);
    ctx.strokeStyle = C_SOLAR_ACCENT;
    ctx.lineWidth = 2;
    ctx.strokeRect(150, 170, 500, 130);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px "Arial Black", sans-serif';
    ctx.fillText(`Você ainda não possui skins da raridade ${invRarityFilter}!`, 400, 225);
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('Abra mais caixas na loja para desbloquear!', 400, 255);
  } else {
    for (let i = 0; i < 8; i++) {
      const listIdx = invPage * 8 + i;
      if (listIdx >= filteredData.count) break;
      const skinId = filteredData.isRange ? (filteredData.start + listIdx) : filteredData.list[listIdx];
      const skin = getSkinById(skinId);

      const col = i % 4;
      const row = Math.floor(i / 4);
      const cx = 36 + col * 186;
      const cy = 88 + row * 158;
      const cw = 170;
      const ch = 148;

      const isEquipped = equippedSkinId === skin.id;

      ctx.fillStyle = isEquipped ? '#2b593f' : C_SOLAR_DARK;
      ctx.fillRect(cx, cy, cw, ch);
      ctx.strokeStyle = isEquipped ? '#52b788' : skin.rarityColor;
      ctx.lineWidth = isEquipped ? 4 : 2;
      ctx.strokeRect(cx, cy, cw, ch);

      ctx.fillStyle = skin.rarityColor;
      ctx.font = 'bold 9px "Arial Black", sans-serif';
      ctx.fillText(skin.rarity, cx + cw / 2, cy + 12);

      ctx.fillStyle = 'rgba(255, 190, 59, 0.22)';
      ctx.fillRect(cx + 12, cy + 16, cw - 24, 62);
      drawSolarisCharacter(cx + cw / 2 - 11, cy + 27, 22, 30, Date.now() / 180, true, 1, 1, 1.38, 1.38, 0, skin, false);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText(skin.name, cx + cw / 2, cy + 95);

      ctx.fillStyle = isEquipped ? '#52b788' : C_SOLAR_ACCENT;
      ctx.fillRect(cx + 16, cy + 107, cw - 32, 28);

      ctx.fillStyle = '#140c09';
      ctx.font = 'bold 11px "Arial Black", sans-serif';
      ctx.fillText(isEquipped ? '✔ EQUIPADA' : 'EQUIPAR', cx + cw / 2, cy + 125);
    }
  }

  ctx.fillStyle = C_SOLAR_DARK;
  ctx.fillRect(40, 412, 170, 30);
  ctx.fillRect(310, 412, 180, 30);
  ctx.fillRect(590, 412, 170, 30);

  ctx.fillStyle = C_SOLAR_ACCENT;
  ctx.font = 'bold 11px "Arial Black", sans-serif';
  ctx.fillText('◀ PÁG ANTERIOR', 125, 431);
  ctx.fillStyle = '#52b788';
  ctx.fillText('📦 ABRIR CAIXAS SKINS', 400, 431);
  ctx.fillStyle = C_SOLAR_ACCENT;
  ctx.fillText('PRÓXIMA PÁG ▶', 675, 431);
  ctx.textAlign = 'left';
}

function drawWeaponsScreen() {
  drawSolarisBackground(unlockedLevel);

  const maxPages = Math.max(1, Math.ceil(ownedWeapons.length / 8));

  ctx.fillStyle = C_SOLAR_DARK;
  ctx.fillRect(0, 0, canvas.width, 50);
  ctx.fillStyle = C_SOLAR_ACCENT;
  ctx.font = 'bold 17px "Arial Black", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`🔫 ARSENAL ANTI-BOSS — ${ownedWeapons.length}/${WEAPONS.length} ARMAS (PÁG ${wepPage + 1}/${maxPages})`, canvas.width / 2, 32);

  for (let i = 0; i < 8; i++) {
    const listIdx = wepPage * 8 + i;
    if (listIdx >= ownedWeapons.length) break;
    const wepId = ownedWeapons[listIdx];
    const wep = getWeaponById(wepId);

    const col = i % 4;
    const row = Math.floor(i / 4);
    const cx = 36 + col * 186;
    const cy = 62 + row * 172;
    const cw = 170;
    const ch = 160;

    const isEquipped = equippedWeaponId === wep.id;

    ctx.fillStyle = isEquipped ? '#2b593f' : C_SOLAR_DARK;
    ctx.fillRect(cx, cy, cw, ch);
    ctx.strokeStyle = isEquipped ? '#52b788' : wep.rarityColor;
    ctx.lineWidth = isEquipped ? 4 : 2;
    ctx.strokeRect(cx, cy, cw, ch);

    ctx.fillStyle = wep.rarityColor;
    ctx.font = 'bold 9px "Arial Black", sans-serif';
    ctx.fillText(wep.rarity, cx + cw / 2, cy + 12);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.fillRect(cx + 12, cy + 16, cw - 24, 58);
    drawWeaponSprite(wep, cx + cw / 2 - 16, cy + 46, 1, 2.1, 0, 0);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.fillText(wep.name, cx + cw / 2, cy + 88);

    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 9.5px sans-serif';
    ctx.fillText(`Dano: ${wep.damage}x • Tiros: ${wep.spread}`, cx + cw / 2, cy + 104);

    ctx.fillStyle = isEquipped ? '#52b788' : C_SOLAR_ACCENT;
    ctx.fillRect(cx + 16, cy + 116, cw - 32, 28);

    ctx.fillStyle = '#140c09';
    ctx.font = 'bold 11px "Arial Black", sans-serif';
    ctx.fillText(isEquipped ? '✔ EQUIPADA' : 'EQUIPAR', cx + cw / 2, cy + 135);
  }

  ctx.fillStyle = C_SOLAR_DARK;
  ctx.fillRect(40, 412, 170, 30);
  ctx.fillRect(310, 412, 180, 30);
  ctx.fillRect(590, 412, 170, 30);

  ctx.fillStyle = C_SOLAR_ACCENT;
  ctx.font = 'bold 11px "Arial Black", sans-serif';
  ctx.fillText('◀ PÁG ANTERIOR', 125, 431);
  ctx.fillStyle = '#ff007f';
  ctx.fillText('🔫 CAIXAS DE ARMAS', 400, 431);
  ctx.fillStyle = C_SOLAR_ACCENT;
  ctx.fillText('PRÓXIMA PÁG ▶', 675, 431);
  ctx.textAlign = 'left';
}

function drawTitleScreen() {
  drawSolarisBackground(unlockedLevel);

  ctx.fillStyle = C_SOLAR_DARK;
  ctx.fillRect(0, 285, canvas.width, 165);
  ctx.fillStyle = C_SOLAR_ACCENT;
  ctx.fillRect(0, 285, canvas.width, 5);

  ctx.fillStyle = C_DANGER;
  for (let i = -1; i <= 1; i++) {
    const sx = canvas.width / 2 + i * 38 - 14;
    ctx.beginPath();
    ctx.moveTo(sx, 285);
    ctx.lineTo(sx + 14, 252);
    ctx.lineTo(sx + 28, 285);
    ctx.fill();
  }

  drawSolarisCharacter(canvas.width / 2 - 11, 210, 22, 30, 0, false, 1, 1, 2.4, 2.4, 0, null, false);

  ctx.fillStyle = C_SOLAR_ACCENT;
  ctx.font = 'bold 54px "Arial Black", Impact, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('SOLARIS DEVIL', canvas.width / 2, 355);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('4 DIFICULDADES • 5 BIOMAS • CAIXAS DE SKINS & ARMAS ANTI-BOSS', canvas.width / 2, 382);

  const pulse = Math.sin(Date.now() / 220) * 3;
  ctx.fillStyle = C_SOLAR_ACCENT;
  ctx.font = 'bold 16px "Arial Black", sans-serif';
  ctx.fillText('▶ APERTE ESPAÇO OU CLIQUE PARA JOGAR', canvas.width / 2, 418 + pulse);
  ctx.textAlign = 'left';
}

function drawMapScreen() {
  const blockLvl = mapPage * 20;
  drawSolarisBackground(blockLvl);

  for (let f of mapFloors) drawSolarPlatform(f, blockLvl);

  for (let i = 0; i < 20; i++) {
    const d = mapDoors[i];
    const globalLvl = mapPage * 20 + i;
    const isBossDoor = (globalLvl + 1) % 20 === 0;
    const isUnlocked = globalLvl <= unlockedLevel;
    const isCompleted = globalLvl < unlockedLevel;

    ctx.fillStyle = isBossDoor ? C_DANGER : C_SOLAR_DARK;
    ctx.fillRect(d.x - 4, d.y - 4, 40, 54);

    ctx.fillStyle = isCompleted ? '#52b788' : (isUnlocked ? '#140e0c' : '#5e3c2e');
    ctx.fillRect(d.x, d.y, 32, 50);

    ctx.fillStyle = isBossDoor ? '#ffccd5' : '#ffffff';
    ctx.font = 'bold 12px "Arial Black", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(isBossDoor ? `☕${globalLvl + 1}` : `${globalLvl + 1}`, d.x + 16, d.y - 7);

    if (!isUnlocked) {
      ctx.fillStyle = C_SOLAR_ACCENT;
      ctx.fillRect(d.x + 10, d.y + 22, 12, 10);
      ctx.strokeStyle = C_SOLAR_ACCENT;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(d.x + 16, d.y + 21, 4, Math.PI, 0);
      ctx.stroke();
    } else if (isCompleted) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('✔', d.x + 16, d.y + 31);
    } else {
      ctx.fillStyle = isBossDoor ? C_DANGER : C_SOLAR_ACCENT;
      ctx.beginPath();
      ctx.arc(d.x + 16, d.y + 24, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawSolarisCharacter(mapPlayer.x, mapPlayer.y, mapPlayer.w, mapPlayer.h, mapPlayer.walkFrame, mapPlayer.grounded, mapPlayer.facing, 1, 1, 1, 0, null, false);

  ctx.fillStyle = C_SOLAR_DARK;
  ctx.fillRect(30, 400, 170, 34);
  ctx.fillRect(600, 400, 170, 34);
  ctx.fillStyle = C_SOLAR_ACCENT;
  ctx.font = 'bold 12px "Arial Black", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('◀ BLOCO ANTERIOR', 115, 421);
  ctx.fillText('PRÓXIMO BLOCO ▶', 685, 421);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText(`Desbloqueado: Fase ${unlockedLevel + 1} / 1000`, canvas.width / 2, 421);
  ctx.textAlign = 'left';
}

function draw() {
  ctx.save();
  if (shakeTimer > 0) ctx.translate((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9);

  if (screen === 'title') drawTitleScreen();
  else if (screen === 'difficulty') drawDifficultyScreen();
  else if (screen === 'shop') drawShopScreen();
  else if (screen === 'inventory') drawInventoryScreen();
  else if (screen === 'weapons') drawWeaponsScreen();
  else if (screen === 'map') drawMapScreen();
  else {
    drawSolarisBackground(currentLevel);

    drawDoor(level.door);
    if (level.fakeDoors) for (let fd of level.fakeDoors) drawDoor(fd);

    for (let s of level.spikes) {
      const count = Math.max(1, Math.floor(s.w / 15));
      const step = s.w / count;
      ctx.fillStyle = C_DANGER;
      ctx.beginPath();
      for (let i = 0; i < count; i++) {
        if (s.upsideDown) {
          ctx.moveTo(s.x + i * step, s.y);
          ctx.lineTo(s.x + i * step + step / 2, s.y + s.h);
          ctx.lineTo(s.x + (i + 1) * step, s.y);
        } else {
          ctx.moveTo(s.x + i * step, s.y + s.h);
          ctx.lineTo(s.x + i * step + step / 2, s.y);
          ctx.lineTo(s.x + (i + 1) * step, s.y + s.h);
        }
      }
      ctx.fill();
    }

    for (let saw of level.saws) {
      ctx.save();
      ctx.translate(saw.x, saw.y);
      ctx.rotate(Date.now() / 50);
      ctx.fillStyle = C_DANGER;
      const teeth = 10;
      ctx.beginPath();
      for (let i = 0; i < teeth * 2; i++) {
        const r = i % 2 === 0 ? saw.r : saw.r * 0.68;
        const a = (i * Math.PI) / teeth;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = C_SOLAR_DARK;
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C_SOLAR_ACCENT;
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    if (level.isBoss) {
      drawCupheadBoss(level.boss);

      for (let p of level.projectiles) {
        ctx.fillStyle = p.parryable ? '#ff70a6' : C_DANGER;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let b of playerBullets) {
        ctx.fillStyle = b.color;
        ctx.globalAlpha = 0.35;
        ctx.beginPath();
        ctx.ellipse(b.x - b.vx * 0.8, b.y - b.vy * 0.8, b.r * 2.2, b.r * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.ellipse(b.x, b.y, b.r * 1.9, b.r * 0.85, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(b.x, b.y, b.r, b.r * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let p of level.platforms) drawSolarPlatform(p, currentLevel);

    drawMysteryChest(level.chest);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    for (let d of dustParticles) {
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (let sw of shockwaves) {
      ctx.save();
      ctx.strokeStyle = sw.color;
      ctx.globalAlpha = sw.alpha;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    if (deadTimer === 0) {
      const shrinkScale = enterDoorTimer > 0 ? enterDoorTimer / 15 : 1;
      const spawnScale = spawnAnimTimer > 0 ? 1 + (spawnAnimTimer / 22) * 0.35 : 1;
      drawSolarisCharacter(
        player.x, player.y, player.w, player.h,
        player.walkFrame, player.grounded, player.facing,
        level.gravityDir || 1,
        player.scaleX * shrinkScale * spawnScale,
        player.scaleY * shrinkScale * spawnScale,
        player.tilt,
        null,
        level.isBoss
      );
    }

    if (bossBannerTimer > 0) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '900 48px "Arial Black", Impact, sans-serif';
      ctx.fillStyle = '#140c09';
      const msg = bossBannerTimer > 35 ? 'PRONTO?!' : 'VAI!!';
      ctx.fillText(msg, 404, 224);
      ctx.fillStyle = '#ffd166';
      ctx.fillText(msg, 400, 220);
      ctx.restore();
    }

    if (knockoutTimer > 0) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '900 56px "Arial Black", Impact, sans-serif';
      ctx.fillStyle = '#140c09';
      ctx.fillText('NOCAUTE!!', 404, 214);
      ctx.fillStyle = '#ff007f';
      ctx.fillText('NOCAUTE!!', 400, 210);
      ctx.restore();
    }

    drawChestOpeningCinematic();

    if (screen === 'victory') {
      ctx.fillStyle = 'rgba(20, 12, 9, 0.94)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = C_SOLAR_ACCENT;
      ctx.font = 'bold 36px "Arial Black", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('LENDA SOLARIS! 1.000 FASES ZERADAS!', canvas.width / 2, 175);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText(`Girassóis Acumulados: 🌻 ${sunflowers}  |  Falhas: ${deaths}`, canvas.width / 2, 230);
      ctx.fillStyle = '#d6c3b3';
      ctx.font = '15px sans-serif';
      ctx.fillText('Clique em [📦 CAIXAS] para abrir mais skins e armas!', canvas.width / 2, 290);
      ctx.textAlign = 'left';
    }
  }

  for (let p of particles) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }

  ctx.textAlign = 'center';
  ctx.font = 'bold 16px "Arial Black", sans-serif';
  for (let ft of floatingTexts) {
    ctx.fillStyle = '#140c09';
    ctx.fillText(ft.text, ft.x + 2, ft.y + 2);
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.textAlign = 'left';

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

updateHUD();
loop();
</script>
