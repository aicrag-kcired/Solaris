let cachedBgKey = '';

function renderBackgroundCache(biome, isBoss) {
  const key = `${biome.name}_${isBoss}`;
  if (cachedBgKey === key) return;
  cachedBgKey = key;

  const grad = bgCtx.createLinearGradient(0, 0, 0, 450);
  if (isBoss) {
    grad.addColorStop(0, '#ff6b00');
    grad.addColorStop(1, '#6a040f');
  } else {
    grad.addColorStop(0, biome.skyTop);
    grad.addColorStop(1, biome.skyBot);
  }
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, 800, 450);

  bgCtx.fillStyle = isBoss ? 'rgba(40, 10, 10, 0.25)' : biome.silhouette;

  if (biome.type === 'sunflowers' || isBoss) {
    const structures = [{ x: 95, y: 185, s: 0.9 }, { x: 310, y: 145, s: 1.1 }, { x: 675, y: 170, s: 1.0 }];
    for (let st of structures) {
      bgCtx.save();
      bgCtx.translate(st.x, st.y);
      bgCtx.scale(st.s, st.s);
      bgCtx.fillRect(-4, 0, 8, 220);
      bgCtx.beginPath();
      bgCtx.arc(0, 0, 18, 0, Math.PI * 2);
      bgCtx.fill();
      for (let a = 0; a < 8; a++) {
        const ang = (a * Math.PI) / 4;
        bgCtx.beginPath();
        bgCtx.ellipse(Math.cos(ang) * 24, Math.sin(ang) * 24, 9, 5, ang, 0, Math.PI * 2);
        bgCtx.fill();
      }
      bgCtx.restore();
    }
  } else if (biome.type === 'volcano') {
    const peaks = [{ x: 140, w: 220, h: 190 }, { x: 430, w: 280, h: 240 }, { x: 700, w: 210, h: 175 }];
    for (let p of peaks) {
      bgCtx.beginPath();
      bgCtx.moveTo(p.x - p.w / 2, 450);
      bgCtx.lineTo(p.x - 24, 450 - p.h);
      bgCtx.lineTo(p.x + 24, 450 - p.h);
      bgCtx.lineTo(p.x + p.w / 2, 450);
      bgCtx.fill();
    }
  } else if (biome.type === 'cyber') {
    const blds = [
      { x: 40, w: 65, h: 240 }, { x: 120, w: 50, h: 180 }, { x: 240, w: 80, h: 270 },
      { x: 360, w: 55, h: 210 }, { x: 520, w: 90, h: 260 }, { x: 650, w: 70, h: 220 }
    ];
    for (let b of blds) {
      bgCtx.fillRect(b.x, 450 - b.h, b.w, b.h);
      bgCtx.fillStyle = 'rgba(0, 245, 212, 0.16)';
      for (let wy = 450 - b.h + 15; wy < 360; wy += 24) {
        bgCtx.fillRect(b.x + 10, wy, b.w - 20, 6);
      }
      bgCtx.fillStyle = biome.silhouette;
    }
  } else if (biome.type === 'arctic') {
    const mtns = [{ x: 110, w: 240, h: 220 }, { x: 380, w: 300, h: 260 }, { x: 660, w: 250, h: 210 }];
    for (let m of mtns) {
      bgCtx.beginPath();
      bgCtx.moveTo(m.x - m.w / 2, 450);
      bgCtx.lineTo(m.x, 450 - m.h);
      bgCtx.lineTo(m.x + m.w / 2, 450);
      bgCtx.fill();
    }
  } else {
    bgCtx.beginPath();
    bgCtx.arc(580, 130, 58, 0, Math.PI * 2);
    bgCtx.fill();
    bgCtx.strokeStyle = 'rgba(255, 0, 127, 0.25)';
    bgCtx.lineWidth = 8;
    bgCtx.beginPath();
    bgCtx.ellipse(580, 130, 95, 22, -0.25, 0, Math.PI * 2);
    bgCtx.stroke();
  }
}

];

function getSkinRarityFromId(id) {
  if (id >= 9000) return 'MÍTICA';
  if (id >= 7000) return 'LENDÁRIA';
  if (id >= 4500) return 'ÉPICA';
  if (id >= 2000) return 'RARA';
  return 'COMUM';
}

function getFilteredInventorySkins(rarity) {
  if (hasMasterToken) {
    let start = 0, end = TOTAL_SKINS;
    if (rarity === 'COMUM') { start = 0; end = 2000; }
    else if (rarity === 'RARA') { start = 2000; end = 4500; }
    else if (rarity === 'ÉPICA') { start = 4500; end = 7000; }
    else if (rarity === 'LENDÁRIA') { start = 7000; end = 9000; }
    else if (rarity === 'MÍTICA') { start = 9000; end = 10000; }
    return { isRange: true, start, count: end - start };
  }
  if (rarity === 'ALL') {
    return { isRange: false, list: ownedSkins, count: ownedSkins.length };
  }
  const filtered = ownedSkins.filter(id => getSkinRarityFromId(id) === rarity);
  return { isRange: false, list: filtered, count: filtered.length };
}

function getSkinById(id) {
  id = Math.max(0, Math.min(TOTAL_SKINS - 1, id));
  if (id === 0) {
    return {
      id: 0, name: 'Técnico Solaris', rarity: 'COMUM', rarityColor: '#adb5bd',
      skinTone: '#f1c27d', suit: '#3d2a22', accent: '#ffa200',
      hat: 'cap', face: 'visor', back: 'scarf', shape: 'normal'
    };
  }

  const r1 = seededRandom(id * 1.17 + 3);
  const r2 = seededRandom(id * 2.31 + 7);
  const r3 = seededRandom(id * 3.79 + 11);
  const r4 = seededRandom(id * 5.13 + 19);
  const r5 = seededRandom(id * 7.41 + 23);

  const pName = SKIN_PREFIXES[Math.floor(r1 * SKIN_PREFIXES.length)];
  const sName = SKIN_SUFFIXES[Math.floor(r2 * SKIN_SUFFIXES.length)];
  const name = `${pName} ${sName} #${id}`;

  let rarity = 'COMUM', rarityColor = '#adb5bd', shape = 'normal';
  if (id >= 9000) {
    rarity = 'MÍTICA'; rarityColor = '#ff007f';
    shape = r3 > 0.5 ? 'floating' : 'mech';
  } else if (id >= 7000) {
    rarity = 'LENDÁRIA'; rarityColor = '#ffd166';
    shape = SHAPES[1 + Math.floor(r3 * (SHAPES.length - 1))];
  } else if (id >= 4500) {
    rarity = 'ÉPICA'; rarityColor = '#c77dff';
    shape = r3 > 0.4 ? 'agile' : 'heavy';
  } else if (id >= 2000) {
    rarity = 'RARA'; rarityColor = '#4cc9f0';
    shape = r3 > 0.7 ? 'agile' : 'normal';
  }

  return {
    id, name, rarity, rarityColor,
    skinTone: SKIN_TONES[Math.floor(r1 * SKIN_TONES.length)],
    suit: SUIT_COLORS[Math.floor(r2 * SUIT_COLORS.length)],
    accent: ACCENT_COLORS[Math.floor(r3 * ACCENT_COLORS.length)],
    hat: HATS[Math.floor(r4 * HATS.length)],
    face: FACES[Math.floor(r5 * FACES.length)],
    back: BACKS[Math.floor(((r1 + r3) % 1) * BACKS.length)],
    shape
  };
}

function openStoreCrate(crate) {

    playSound('trap');
    shakeTimer = 6;
    spawnFloatingText(400, 210, 'GIRASSÓIS INSUFICIENTES!', '#ff758f');

  sunflowers -= crate.price;

    ownedSkins.push(wonId);
    ownedSkins.sort((a, b) => a - b);

    mode: 'skin',
    crateName: crate.name, crateColor: crate.borderColor,
    rouletteIds, finalId: wonId

}

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  if (!soundEnabled) return;
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;

  if (type === 'jump') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(520, now + 0.11);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
    osc.start(now); osc.stop(now + 0.11);
  } else if (type === 'shoot') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(820, now);
    osc.frequency.exponentialRampToValueAtTime(260, now + 0.07);
    gain.gain.setValueAtTime(0.05, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    osc.start(now); osc.stop(now + 0.07);
  } else if (type === 'parry') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(660, now);
    osc.frequency.exponentialRampToValueAtTime(1320, now + 0.14);
    gain.gain.setValueAtTime(0.14, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    osc.start(now); osc.stop(now + 0.14);
  } else if (type === 'tick') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, now);
    gain.gain.setValueAtTime(0.05, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
    osc.start(now); osc.stop(now + 0.04);
  } else if (type === 'trap') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(145, now);
    osc.frequency.linearRampToValueAtTime(65, now + 0.14);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    osc.start(now); osc.stop(now + 0.14);
  } else if (type === 'charge') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(760, now + 0.65);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
    osc.start(now); osc.stop(now + 0.65);
  } else if (type === 'coin') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587, now);
    osc.frequency.setValueAtTime(880, now + 0.08);
    gain.gain.setValueAtTime(0.11, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    osc.start(now); osc.stop(now + 0.24);
  } else if (type === 'jackpot') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523, now);
    osc.frequency.setValueAtTime(659, now + 0.09);
    osc.frequency.setValueAtTime(784, now + 0.18);
    osc.frequency.setValueAtTime(1046, now + 0.27);
    osc.frequency.setValueAtTime(1318, now + 0.36);
    gain.gain.setValueAtTime(0.16, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
    osc.start(now); osc.stop(now + 0.55);
  } else if (type === 'bosshit') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.exponentialRampToValueAtTime(90, now + 0.16);
    gain.gain.setValueAtTime(0.09, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    osc.start(now); osc.stop(now + 0.16);
  } else if (type === 'die') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(35, now + 0.3);
    gain.gain.setValueAtTime(0.14, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
  } else if (type === 'win') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.setValueAtTime(554, now + 0.07);
    osc.frequency.setValueAtTime(659, now + 0.14);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
    osc.start(now); osc.stop(now + 0.32);
  }
}

function fireSolarShot() {
  if (shootCooldown > 0 || !level || !level.isBoss) return;
  const wep = getActiveWeapon();
  shootCooldown = wep.cooldown;
  weaponRecoil = 6;
  muzzleFlashTimer = 4;
  playSound('shoot');

  const startX = player.x + (player.facing === 1 ? player.w + 14 : -14);
  const startY = player.y + 15;

  if (wep.spread === 1) {
    playerBullets.push({
      x: startX, y: startY,
      vx: player.facing * wep.speed, vy: 0,
      r: wep.damage >= 3 ? 7 : 5,
      damage: wep.damage,
      color: wep.bulletColor
    });
  } else if (wep.spread === 2) {
    for (let dy of [-1.4, 1.4]) {
      playerBullets.push({
        x: startX, y: startY,
        vx: player.facing * wep.speed, vy: dy,
        r: 5,
        damage: wep.damage,
        color: wep.bulletColor
      });
    }
  } else {
    for (let dy of [-2.4, 0, 2.4]) {
      playerBullets.push({
        x: startX, y: startY,
        vx: player.facing * wep.speed, vy: dy,
        r: 5,
        damage: wep.damage,
        color: wep.bulletColor
      });
    }
  }
}

window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    if (chestAnim.active && chestAnim.timer > 50 && (e.code === 'Space' || e.code === 'Enter')) {
      chestAnim.active = false; return;
    }
    if (crateAnim.active && crateAnim.timer > 85 && (e.code === 'Space' || e.code === 'Enter')) {
      crateAnim.active = false; return;
    }
    if (e.code === 'Escape') {
      if (screen === 'difficulty') goMap();
      else if (screen === 'playing' || screen === 'shop' || screen === 'inventory' || screen === 'weapons') goMap();
      else if (screen === 'map') goTitle();
    }
    if (screen === 'title' && (e.code === 'Space' || e.code === 'Enter')) goMap();
    else if (screen === 'difficulty') {
      if (e.code === 'Digit1' || e.code === 'Numpad1') confirmDifficultyAndStart('easy');
      if (e.code === 'Digit2' || e.code === 'Numpad2' || e.code === 'Enter' || e.code === 'Space') confirmDifficultyAndStart('medium');
      if (e.code === 'Digit3' || e.code === 'Numpad3') confirmDifficultyAndStart('hard');
      if (e.code === 'Digit4' || e.code === 'Numpad4') confirmDifficultyAndStart('impossible');
    } else if (screen === 'inventory') {
      if (e.code === 'ArrowRight' || e.code === 'KeyD') changeInvPage(1);
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeInvPage(-1);
    } else if (screen === 'weapons') {
      if (e.code === 'ArrowRight' || e.code === 'KeyD') changeWepPage(1);
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeWepPage(-1);
    } else if (screen === 'map') {
      if (e.code === 'BracketRight' || e.code === 'PageDown') changeMapPage(1);
      if (e.code === 'BracketLeft' || e.code === 'PageUp') changeMapPage(-1);
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyW' || e.code === 'ArrowUp') {
        for (let i = 0; i < 20; i++) {
          const d = mapDoors[i];
          const globalLvl = mapPage * 20 + i;
          if (Math.abs((mapPlayer.x + 9) - (d.x + 16)) < 26 && Math.abs((mapPlayer.y + 13) - (d.y + 25)) < 30) {
            if (globalLvl <= unlockedLevel) { openDifficultySelect(globalLvl); return; }
            else { playSound('trap'); shakeTimer = 6; return; }
          }
        }
        if (mapPlayer.grounded) { mapPlayer.vy = -10.8; mapPlayer.grounded = false; playSound('jump'); }
      }
    } else if (screen === 'playing' && !chestAnim.active) {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        if (level && level.isBoss && !player.grounded) {
          for (let i = level.projectiles.length - 1; i >= 0; i--) {
            const p = level.projectiles[i];
            if (p.parryable && Math.hypot((player.x + player.w / 2) - p.x, (player.y + player.h / 2) - p.y) < p.r + 24) {
              level.projectiles.splice(i, 1);
              player.vy = -11.6;
              player.scaleX = 0.72;
              player.scaleY = 1.32;
              playSound('parry');
              sunflowers += 5;
              localStorage.setItem('solaris_v4_coins', sunflowers);
              updateHUD();
              spawnFloatingText(p.x, p.y - 10, 'PARRY! +5 🌻', '#ff70a6');
              shockwaves.push({ x: p.x, y: p.y, r: 5, color: '#ff70a6', alpha: 1 });
              return;
            }
          }
        }
        jumpBuffer = 8;
      }
      if (e.code === 'KeyJ' || e.code === 'KeyZ' || e.code === 'KeyX' || e.code === 'ShiftLeft') {
        fireSolarShot();
      }
      if (e.code === 'KeyR') loadLevel(currentLevel);
    }
  }
  keys[e.code] = true;
});
window.addEventListener('keyup', e => keys[e.code] = false);

function changeMapPage(dir) {
  mapPage = Math.max(0, Math.min(49, mapPage + dir));
  const biome = getBiomeForLevel(mapPage * 20);
  document.getElementById('statusText').textContent = `BLOCO ${mapPage + 1}/50 • ${biome.name}`;
}

function changeInvPage(dir) {
  const data = getFilteredInventorySkins(invRarityFilter);
  const maxPages = Math.max(1, Math.ceil(data.count / 8));
  invPage = (invPage + dir + maxPages) % maxPages;
}

function changeWepPage(dir) {
  const maxPages = Math.max(1, Math.ceil(ownedWeapons.length / 8));
  wepPage = (wepPage + dir + maxPages) % maxPages;
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (chestAnim.active && chestAnim.timer > 50) { chestAnim.active = false; return; }
  if (crateAnim.active) {
    if (crateAnim.timer > 85) crateAnim.active = false;
    return;
  }

  if (screen === 'title') { goMap(); return; }

  if (screen === 'difficulty') {
    for (let i = 0; i < DIFFICULTIES.length; i++) {
      const cx = 24 + i * 191;
      const cy = 108;
      const cw = 179;
      const ch = 268;
      if (mx >= cx && mx <= cx + cw && my >= cy && my <= cy + ch) {
        confirmDifficultyAndStart(DIFFICULTIES[i].id);
        return;
      }
    }
    if (my >= 395 && my <= 430 && mx >= 310 && mx <= 490) {
      goMap();
    }
    return;
  }

  if (screen === 'playing' && level && level.isBoss && !chestAnim.active) {
    player.facing = mx >= player.x + player.w / 2 ? 1 : -1;
    fireSolarShot();
    return;
  }

  if (screen === 'shop') {
    if (my >= 54 && my <= 86) {
      if (mx >= 165 && mx <= 390) {
        shopTab = 'skins';
        playSound('tick');
        document.getElementById('statusText').textContent = 'LOJA DE SKINS SOLARIS';
        return;
      }
      if (mx >= 410 && mx <= 635) {
        shopTab = 'weapons';
        playSound('tick');
        document.getElementById('statusText').textContent = 'LOJA DE ARMAS (BOSS)';
        return;
      }
    }

    const activeList = shopTab === 'weapons' ? WEAPON_CRATES : CRATES;
    for (let i = 0; i < activeList.length; i++) {
      const cx = 32 + i * 188;
      const cy = 96;
      const cw = 172;
      const ch = 295;
      if (mx >= cx && mx <= cx + cw && my >= cy && my <= cy + ch) {
        if (shopTab === 'weapons') openWeaponCrate(activeList[i]);
        else openStoreCrate(activeList[i]);
        return;
      }
    }
    return;
  }

  if (screen === 'inventory') {
    // Clique nas abas de filtro por raridade (y: 54..80)
    if (my >= 54 && my <= 80) {
      for (let i = 0; i < RARITY_FILTERS.length; i++) {
        const bx = 36 + i * 123;
        const bw = 116;
        if (mx >= bx && mx <= bx + bw) {
          invRarityFilter = RARITY_FILTERS[i].id;
          invPage = 0;
          playSound('tick');
          return;
        }
      }
    }

    const filteredData = getFilteredInventorySkins(invRarityFilter);
    if (my >= 412 && my <= 444) {
      if (mx >= 40 && mx <= 210) { changeInvPage(-1); return; }
      if (mx >= 590 && mx <= 760) { changeInvPage(1); return; }
      if (mx >= 310 && mx <= 490) { shopTab = 'skins'; goShop(); return; }
    }

    for (let i = 0; i < 8; i++) {
      const listIdx = invPage * 8 + i;
      if (listIdx >= filteredData.count) break;
      const skinId = filteredData.isRange ? (filteredData.start + listIdx) : filteredData.list[listIdx];

      const col = i % 4;
      const row = Math.floor(i / 4);
      const cx = 36 + col * 186;
      const cy = 88 + row * 158;
      const cw = 170;
      const ch = 148;

      if (mx >= cx && mx <= cx + cw && my >= cy && my <= cy + ch) {
        equippedSkinId = skinId;
        localStorage.setItem('solaris_v4_skin', equippedSkinId);
        playSound('jump');
        return;
      }
    }
    return;
  }

  if (screen === 'weapons') {
    if (my >= 412 && my <= 444) {
      if (mx >= 40 && mx <= 210) { changeWepPage(-1); return; }
      if (mx >= 590 && mx <= 760) { changeWepPage(1); return; }
      if (mx >= 310 && mx <= 490) { shopTab = 'weapons'; goShop(); return; }
    }

    for (let i = 0; i < 8; i++) {
      const listIdx = wepPage * 8 + i;
      if (listIdx >= ownedWeapons.length) break;
      const wepId = ownedWeapons[listIdx];

      const col = i % 4;
      const row = Math.floor(i / 4);
      const cx = 36 + col * 186;
      const cy = 62 + row * 172;
      const cw = 170;
      const ch = 160;

      if (mx >= cx && mx <= cx + cw && my >= cy && my <= cy + ch) {
        equippedWeaponId = wepId;
        localStorage.setItem('solaris_v4_weapon', equippedWeaponId);
        playSound('shoot');
        return;
      }
    }
    return;
  }

  if (screen === 'map') {
    if (my >= 400 && my <= 438) {
      if (mx >= 30 && mx <= 200) { changeMapPage(-1); return; }
      if (mx >= 600 && mx <= 770) { changeMapPage(1); return; }
    }
    for (let i = 0; i < 20; i++) {
      const d = mapDoors[i];
      const globalLvl = mapPage * 20 + i;
      if (mx >= d.x - 8 && mx <= d.x + 40 && my >= d.y - 8 && my <= d.y + 56) {
        if (globalLvl <= unlockedLevel) openDifficultySelect(globalLvl);
        else { playSound('trap'); shakeTimer = 6; }
        return;
      }
    }
  }
});

// Garantindo que TODAS as plataformas e buracos sejam 100% alcançáveis!
const player = {
  x: 60, y: 280, w: 22, h: 30,
  vx: 0, vy: 0,
  maxSpeed: 4.95,
  jumpForce: -11.6,
  grounded: false,
  wasGrounded: false,
  facing: 1,
  walkFrame: 0,
  scaleX: 1,
  scaleY: 1,
  tilt: 0
};

function drawWeaponSprite(wep, x, y, facing = 1, scale = 1, recoil = 0, flash = 0) {
  ctx.save();
  ctx.translate(x - facing * recoil, y);
  ctx.scale(facing * scale, scale);

  if (wep.rarity === 'MÍTICA' || wep.rarity === 'LENDÁRIA') {
    ctx.fillStyle = wep.rarity === 'MÍTICA' ? 'rgba(255, 0, 127, 0.25)' : 'rgba(255, 209, 102, 0.25)';
    ctx.beginPath();
    ctx.arc(6, 0, 14, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#140c09';
  ctx.fillRect(-2, 1, 5, 7);

  if (wep.style === 'pistol') {
    ctx.fillStyle = wep.bodyColor;
    ctx.fillRect(-3, -4, 13, 6);
    ctx.fillStyle = wep.barrelColor;
    ctx.fillRect(8, -3, 6, 4);
  } else if (wep.style === 'smg') {
    ctx.fillStyle = wep.bodyColor;
    ctx.fillRect(-4, -5, 16, 7);
    ctx.fillStyle = '#adb5bd';
    ctx.fillRect(3, 2, 4, 6);
    ctx.fillStyle = wep.barrelColor;
    ctx.fillRect(11, -3, 7, 3);
  } else if (wep.style === 'rifle') {
    ctx.fillStyle = wep.bodyColor;
    ctx.fillRect(-6, -5, 20, 6);
    ctx.fillStyle = wep.barrelColor;
    ctx.fillRect(12, -4, 10, 4);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(2, -7, 6, 2);
  } else if (wep.style === 'heavy') {
    ctx.fillStyle = wep.bodyColor;
    ctx.fillRect(-5, -6, 18, 9);
    ctx.fillStyle = wep.barrelColor;
    ctx.fillRect(11, -5, 9, 3);
    ctx.fillRect(11, -1, 9, 3);
  } else {
    ctx.fillStyle = wep.bodyColor;
    ctx.fillRect(-6, -7, 22, 11);
    ctx.fillStyle = wep.barrelColor;
    ctx.fillRect(14, -6, 9, 9);
    ctx.fillStyle = wep.bulletColor;
    ctx.beginPath();
    ctx.arc(6, -1.5, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  if (flash > 0) {
    const barrelEnd = wep.style === 'pistol' ? 15 : (wep.style === 'smg' ? 19 : 24);
    ctx.fillStyle = wep.bulletColor;
    ctx.beginPath();
    ctx.arc(barrelEnd, -1.5, 5 + flash * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(barrelEnd, -1.5, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawSolarisToken(cx, cy, radius, rotation = 0) {
  ctx.save();
  ctx.translate(cx, cy);

  const glow = ctx.createRadialGradient(0, 0, radius * 0.2, 0, 0, radius * 1.45);
  glow.addColorStop(0, 'rgba(255, 240, 140, 0.85)');
  glow.addColorStop(0.5, 'rgba(255, 175, 0, 0.45)');
  glow.addColorStop(1, 'rgba(255, 175, 0, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, radius * 1.45, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.rotate(rotation);

  ctx.strokeStyle = '#d48806';
  ctx.lineWidth = radius * 0.22;
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.86, -Math.PI * 0.45, Math.PI * 0.65);
  ctx.stroke();

  ctx.strokeStyle = '#ffd666';
  ctx.lineWidth = radius * 0.16;
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.86, -Math.PI * 0.42, Math.PI * 0.62);
  ctx.stroke();

  for (let i = 0; i < 4; i++) {
    ctx.save();
    ctx.rotate((i * Math.PI) / 2);
    ctx.fillStyle = '#ffe58f';
    ctx.beginPath();
    ctx.moveTo(0, -radius * 1.15);
    ctx.lineTo(radius * 0.16, -radius * 0.52);
    ctx.lineTo(0, -radius * 0.52);
    ctx.fill();
    ctx.fillStyle = '#ad6800';
    ctx.beginPath();
    ctx.moveTo(0, -radius * 1.15);
    ctx.lineTo(-radius * 0.16, -radius * 0.52);
    ctx.lineTo(0, -radius * 0.52);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  ctx.fillStyle = '#874d00';
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.58, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffa940';
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.51, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = `900 ${Math.floor(radius * 0.78)}px "Arial Black", Impact, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('S', 0, 2);

  ctx.restore();
}

const BOSS_NAMES = [
  'DR. REATOR SOLAR', 'BARÃO DO ECLIPSE', 'RAINHA GIRASSOL', 'CAPITÃO PLASMA',
  'GENERAL FUSÃO', 'TITÃ FOTOVOLTAICO', 'MAGO TÉRMICO', 'COLOSSO DE NEON',
  'ARCONTE CÓSMICO', 'SOLARIS PRIME'
];
const BOSS_COLORS = ['#3d2a22', '#1d3557', '#6a040f', '#3c096c', '#005f73', '#7f4f24', '#212529', '#590d22', '#003049', '#8b0000'];

function getLevelData(idx) {
  const levelNum = idx + 1;
  const diffCfg = getDiffConfig();
  const isEasy = currentDifficulty === 'easy';
  const isMedium = currentDifficulty === 'medium';
  const isHard = currentDifficulty === 'hard';
  const isImpossible = currentDifficulty === 'impossible';

  const diffMult = isEasy ? 0.62 : (isMedium ? 1.0 : (isHard ? 1.38 : 1.72));
  const difficulty = Math.min(1, (idx / 950));
  const isBoss = (levelNum % 20 === 0);
  const hasChest = !isBoss && !openedChests.includes(idx) && (Math.random() < 0.22);

  if (isBoss) {
    const bossTier = levelNum / 20;
    const baseHp = isEasy ? 36 : (isMedium ? 62 : (isHard ? 92 : 128));
    const maxHp = baseHp + Math.min(70, bossTier * 3);
    const bossName = `${BOSS_NAMES[bossTier % BOSS_NAMES.length]} #${bossTier}`;
    const bossColor = BOSS_COLORS[bossTier % BOSS_COLORS.length];
    const bossArchetype = bossTier % 4;
    const activeWep = getActiveWeapon();

    return {
      isBoss: true,
      title: `☕ BOSS #${bossTier} [${diffCfg.name}] • ARMA: ${activeWep.name}`,
      spawn: { x: 85, y: 310 },
      door: { x: 383, y: 294, w: 34, h: 56, open: false },
      platforms: [
        { x: 0, y: 350, w: 800, h: 100 },
        { x: 95, y: 265, w: 120, h: 16 },
        { x: 340, y: 205, w: 120, h: 16 },
        { x: 585, y: 265, w: 120, h: 16 }
      ],
      spikes: [], saws: [], fakeDoors: [], projectiles: [],
      chest: null,
      boss: {
        x: 560, y: 170,
        w: 84, h: 92,
        vx: -2.0 * diffMult, vy: 0,
        hp: maxHp, maxHp: maxHp,
        phase: 1,
        timer: 0, hurtTimer: 0,
        name: bossName, color: bossColor, archetype: bossArchetype
      },
      update(s) {
        const b = s.boss;
        if (b.hp <= 0) {
          if (!s.door.open) {
            s.projectiles = [];
            s.door.open = true;
            knockoutTimer = 95;
            shakeTimer = 22;
            playSound('jackpot');
            for (let i = 0; i < 48; i++) {
              const ang = Math.random() * Math.PI * 2;
              const spd = 2 + Math.random() * 11;
              particles.push({
                x: b.x + b.w / 2, y: b.y + b.h / 2,
                vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
                size: 5 + Math.random() * 6,
                color: i % 2 === 0 ? '#ffd166' : '#ff007f',
                life: 55
              });
            }
          }
          return;
        }

        b.timer++;
        if (b.hurtTimer > 0) b.hurtTimer--;

        const hpRatio = b.hp / b.maxHp;
        const newPhase = hpRatio <= 0.30 ? 3 : (hpRatio <= 0.65 ? 2 : 1);
        if (newPhase > b.phase) {
          b.phase = newPhase;
          shakeTimer = 16;
          playSound('charge');
          spawnFloatingText(b.x + b.w / 2, b.y - 15, `FASE ${b.phase}! ENFURECIDO!`, '#ff007f');
        }

        const speedMult = (1 + (b.phase - 1) * 0.32) * diffMult;
        if (b.archetype === 0 || b.phase === 3) {
          b.x += b.vx * speedMult;
          b.y = 145 + Math.sin(b.timer * 0.045) * 65;
          if (b.x <= 60 || b.x + b.w >= 740) b.vx *= -1;
        } else if (b.archetype === 1) {
          b.x += b.vx * speedMult;
          if (b.x <= 50 || b.x + b.w >= 750) b.vx *= -1;
          b.vy += 0.55;
          b.y += b.vy;
          if (b.y + b.h >= 350) {
            b.y = 350 - b.h;
            b.vy = b.timer % 90 === 0 ? -12.5 : 0;
            if (b.vy < 0) { shakeTimer = 6; playSound('trap'); }
          }
        } else {
          b.x += b.vx * speedMult;
          b.y = 210 + Math.cos(b.timer * 0.03) * 35;
          if (b.x <= 60 || b.x + b.w >= 740) b.vx *= -1;
          if (b.phase === 3 && b.timer % 160 === 0) {
            b.x = player.x > 400 ? 110 : 610;
            shakeTimer = 8;
            playSound('trap');
          }
        }

        const fireRate = Math.max(22, Math.floor((76 - b.phase * 13) / diffMult));
        if (b.timer % fireRate === 0) {
          playSound('trap');
          const cx = b.x + b.w / 2;
          const cy = b.y + b.h / 2;
          const angToPlayer = Math.atan2((player.y + 15) - cy, (player.x + 11) - cx);
          const projSpd = (3.4 + b.phase * 0.65) * diffMult;

          const isParryPink = Math.random() < (isEasy ? 0.35 : 0.26);
          s.projectiles.push({
            x: cx, y: cy,
            vx: Math.cos(angToPlayer) * projSpd,
            vy: Math.sin(angToPlayer) * projSpd,
            r: 10, parryable: isParryPink
          });

          if (!isEasy && b.phase >= 2) {
            for (let offset of [-0.32, 0.32]) {
              s.projectiles.push({
                x: cx, y: cy,
                vx: Math.cos(angToPlayer + offset) * (projSpd * 0.88),
                vy: Math.sin(angToPlayer + offset) * (projSpd * 0.88),
                r: 8, parryable: false
              });
            }
          }

          if ((isHard || isImpossible) && b.phase === 3) {
            s.projectiles.push({
              x: 80 + Math.random() * 640, y: 10,
              vx: 0, vy: 3.3 * diffMult,
              r: 9, parryable: Math.random() < 0.35
            });
          }
        }

        for (let p of s.projectiles) {
          p.x += p.vx;
          p.y += p.vy;
          if (Math.hypot((player.x + player.w / 2) - p.x, (player.y + player.h / 2) - p.y) < p.r + 7) {
            killPlayer(); return;
          }
        }
        s.projectiles = s.projectiles.filter(p => p.x > -30 && p.x < 830 && p.y > -30 && p.y < 480);

        if (rectHit(player, b)) {
          const hitFromTop = player.vy > 0 && (player.y + player.h - player.vy) <= b.y + 24;
          if (hitFromTop) {
            b.hp -= 4;
            b.hurtTimer = 14;
            player.vy = -11.6;
            shakeTimer = 10;
            playSound('bosshit');
            spawnFloatingText(b.x + b.w / 2, b.y, '-4!', '#ffd166');
          } else {
            killPlayer();
          }
        }
      }
    };
  }

  // FASES NORMAIS — GARANTINDO QUE TODAS AS PLATAFORMAS SEJAM ALCANÇÁVEIS
  const r1 = seededRandom(levelNum * 1.13 + 0.5);
  const r2 = seededRandom(levelNum * 2.71 + 1.3);
  const r3 = seededRandom(levelNum * 4.19 + 2.7);
  const r4 = seededRandom(levelNum * 6.83 + 4.1);

  const archetype = (levelNum + Math.floor(r4 * 5)) % 10;
  // Buracos travados dentro do alcance seguro do salto (max 122px)
  const gap1 = isEasy ? 54 : (isMedium ? Math.floor(78 + difficulty * 18) : (isHard ? Math.floor(98 + difficulty * 16) : 118));
  const gap2 = isEasy ? 52 : (isMedium ? Math.floor(76 + difficulty * 18) : (isHard ? Math.floor(96 + difficulty * 16) : 115));
  const trapSpeed = (4.6 + difficulty * 4.5 + r3 * 1.2) * diffMult;
  const floorY = 325 + Math.floor(r4 * 15);

  let baseLevel;
  switch (archetype) {
    case 1: {
      const holeX = Math.floor(205 + r1 * 175);
      const spX = holeX + gap1 + 85;
      baseLevel = {
        title: `FASE ${levelNum} [${diffCfg.name}]`,
        spawn: { x: 50, y: floorY - 40 },
        door: { x: 715, y: floorY - 56, w: 34, h: 56, open: true },
        platforms: [
          { x: 0, y: floorY, w: holeX, h: 450 - floorY },
          { id: 'trap', x: holeX, y: floorY, w: gap1, h: 450 - floorY, trig: false },
          { x: holeX + gap1, y: floorY, w: 800 - (holeX + gap1), h: 450 - floorY }
        ],
        spikes: (!isEasy && spX < 650) ? [{ x: spX, y: floorY - 20, w: isImpossible ? 42 : 30, h: 20 }] : [],
        saws: isImpossible ? [{ x: holeX + gap1 / 2, y: floorY - 102, r: 17, vy: 2.6 }] : [],
        fakeDoors: [], projectiles: [],
        update(s) {
          const tf = s.platforms[1];
          const triggerDist = isEasy ? 32 : (isImpossible ? 80 : 56);
          if (player.x > holeX - triggerDist && !tf.trig) { tf.trig = true; shakeTimer = 6; playSound('trap'); }
          if (tf.trig) tf.y += trapSpeed + 4;
          for (let saw of s.saws) {
            saw.y += saw.vy;
            if (saw.y > floorY - 42 || saw.y < floorY - 130) saw.vy *= -1;
          }
        }
      };
      break;
    }

    case 2: {
      const spStart = Math.floor(410 + r1 * 165);
      const spTarget = spStart - (isEasy ? 55 : (isImpossible ? 135 : 95));
      baseLevel = {
        title: `FASE ${levelNum} [${diffCfg.name}]`,
        spawn: { x: 50, y: floorY - 40 },
        door: { x: 715, y: floorY - 56, w: 34, h: 56, open: true },
        platforms: [{ x: 0, y: floorY, w: 800, h: 450 - floorY }],
        spikes: [
          { x: spStart, y: floorY - 20, w: isEasy ? 28 : 40, h: 20, moved: false, started: false },
          ...((isHard || isImpossible) ? [{ x: 605, y: floorY - 20, w: 32, h: 20 }] : [])
        ],
        saws: isImpossible ? [{ x: 255, y: floorY - 22, r: 17, vy: 0 }] : [],
        fakeDoors: [], projectiles: [],
        update(s) {
          const sp = s.spikes[0];
          if (player.x > spTarget - 65 && !sp.moved) {
            if (!sp.started) { sp.started = true; playSound('trap'); }
            sp.x -= trapSpeed;
            if (sp.x <= spTarget) sp.moved = true;
          }
        }
      };
      break;
    }

    case 3: {
      const spX = Math.floor(425 + r1 * 105);
      const doorDest = Math.floor(110 + r2 * 95);
      baseLevel = {
        title: `FASE ${levelNum} [${diffCfg.name}]`,
        spawn: { x: 50, y: floorY - 40 },
        door: { x: 690, y: floorY - 56, w: 34, h: 56, fled: false, open: true },
        platforms: [{ x: 0, y: floorY, w: 800, h: 450 - floorY }],
        spikes: isEasy ? [] : [{ x: spX, y: floorY, w: isImpossible ? 42 : 34, h: 20, pop: false }],
        saws: isImpossible ? [{ x: 280, y: floorY - 100, r: 18, vy: 3.2 }] : [],
        fakeDoors: [], projectiles: [],
        update(s) {
          if (s.spikes.length > 0) {
            const sp = s.spikes[0];
            if (player.x > spX - 75 && !sp.pop) { sp.pop = true; sp.y = floorY - 20; playSound('trap'); }
          }
          if (player.x > 600 && !s.door.fled) { s.door.fled = true; shakeTimer = 8; playSound('trap'); }
          if (s.door.fled && s.door.x > doorDest) s.door.x -= (7.5 * diffMult);
          for (let saw of s.saws) {
            saw.y += saw.vy;
            if (saw.y > floorY - 35 || saw.y < floorY - 130) saw.vy *= -1;
          }
        }
      };
      break;
    }

    case 4: {
      const ceilSpeed = (1.1 + difficulty * 0.45) * diffMult;
      const ceilX = 135 + Math.floor(r1 * 40);
      baseLevel = {
        title: `FASE ${levelNum} [${diffCfg.name}]`,
        spawn: { x: 50, y: floorY - 40 },
        door: { x: 715, y: floorY - 56, w: 34, h: 56, open: true },
        platforms: [
          { x: 0, y: floorY, w: 800, h: 450 - floorY },
          { id: 'ceil', x: ceilX, y: -150, w: 500, h: 200, started: false }
        ],
        spikes: (isHard || isImpossible) ? [{ x: 410, y: floorY - 18, w: 28, h: 18 }] : [],
        saws: [], fakeDoors: [], projectiles: [],
        update(s) {
          const c = s.platforms[1];
          const minClearance = 250; // Espaço garantido para pular espinhos com folga
          if (player.x > 100 && c.y < floorY - minClearance) {
            if (!c.started) { c.started = true; playSound('trap'); }
            c.y += ceilSpeed;
          }
          if (player.x + player.w > c.x + 4 && player.x < c.x + c.w - 4 && c.y + c.h >= player.y + 4) killPlayer();
        }
      };
      break;
    }

    case 5: {
      const p1w = Math.floor(205 + r1 * 65);
      const p2w = Math.floor(150 + r2 * 55);
      const p3x = p1w + gap1 + p2w + gap2;
      baseLevel = {
        title: isEasy ? `FASE ${levelNum} [${diffCfg.name}]` : `FASE ${levelNum} [${diffCfg.name} - INVERTIDO]`,
        invertControls: !isEasy,
        spawn: { x: 50, y: floorY - 40 },
        door: { x: 715, y: floorY - 56, w: 34, h: 56, open: true },
        platforms: [
          { x: 0, y: floorY, w: p1w, h: 450 - floorY },
          { x: p1w + gap1, y: floorY, w: p2w, h: 450 - floorY },
          { x: p3x, y: floorY, w: 800 - p3x, h: 450 - floorY }
        ],
        spikes: (isHard || isImpossible) ? [{ x: p1w + gap1 + 54, y: floorY - 18, w: 26, h: 18 }] : [],
        saws: [], fakeDoors: [], projectiles: [],
        update() {}
      };
      break;
    }

    case 6: {
      const flipX = Math.floor(305 + r1 * 115);
      const ceilH = 105 + Math.floor(r2 * 25);
      baseLevel = {
        title: `FASE ${levelNum} [${diffCfg.name}]`,
        spawn: { x: 50, y: floorY - 40 },
        door: { x: 710, y: ceilH, w: 34, h: 56, open: true },
        platforms: [
          { x: 0, y: floorY, w: flipX + 115, h: 450 - floorY },
          { x: flipX - 55, y: 0, w: 855 - flipX, h: ceilH }
        ],
        spikes: isEasy ? [] : [
          { x: flipX + 150, y: ceilH, w: 38, h: 20, upsideDown: true },
          ...((isHard || isImpossible) ? [{ x: flipX + 285, y: ceilH, w: 32, h: 20, upsideDown: true }] : [])
        ],
        saws: [], fakeDoors: [], projectiles: [],
        update(s) {
          const newG = player.x > flipX ? -1 : 1;
          if (newG !== s.gravityDir) playSound('trap');
          s.gravityDir = newG;
        }
      };
      break;
    }

    case 7: {
      // Blocos sequenciais com distância curta (126px) e diferença de altura suave (<= 16px)
      const blocks = [];
      const count = 4;
      const spacing = 126;
      const platWidth = isEasy ? 94 : (isMedium ? 78 : (isHard ? 66 : 58));
      for (let i = 0; i < count; i++) {
        const yOff = Math.floor((seededRandom(levelNum + i) - 0.5) * 16);
        blocks.push({ id: 'b' + i, x: 148 + i * spacing, y: 300 + yOff, w: platWidth, h: 18, timer: 0, trig: false });
      }
      baseLevel = {
        title: `FASE ${levelNum} [${diffCfg.name}]`,
        spawn: { x: 45, y: 260 },
        door: { x: 720, y: 244, w: 34, h: 56, open: true },
        platforms: [
          { x: 0, y: 300, w: 122, h: 150 },
          ...blocks,
          { x: 685, y: 300, w: 115, h: 150 }
        ],
        spikes: [], saws: [], fakeDoors: [], projectiles: [],
        update(s) {
          const delay = isEasy ? 34 : (isMedium ? 20 : (isHard ? 13 : 8));
          for (let p of s.platforms) {
            if (!p.id) continue;
            if (player.grounded && player.x + player.w > p.x && player.x < p.x + p.w && !p.trig) {
              p.trig = true; playSound('trap');
            }
            if (p.trig) { p.timer++; if (p.timer > delay) p.y += 10; }
          }
        }
      };
      break;
    }

    case 8: {
      // Plataforma elevada a 78px do chão (100% alcançável com pulo de 116px)
      const sawSpeed = (3.2 + difficulty * 3.0) * diffMult;
      const saw1X = 220 + Math.floor(r2 * 50);
      const saw2X = 520 + Math.floor(r3 * 60);
      baseLevel = {
        title: `FASE ${levelNum} [${diffCfg.name}]`,
        spawn: { x: 50, y: floorY - 40 },
        door: { x: 715, y: floorY - 56, w: 34, h: 56, open: true },
        platforms: [
          { x: 0, y: floorY, w: 800, h: 450 - floorY },
          { x: 330, y: floorY - 78, w: 125, h: 18 }
        ],
        spikes: (isHard || isImpossible) ? [{ x: 372, y: floorY - 20, w: 38, h: 20 }] : [],
        saws: isEasy ? [] : [
          { x: saw1X, y: 120, r: 19, vy: sawSpeed },
          { x: saw2X, y: floorY - 30, r: 19, vy: -sawSpeed },
          ...(isImpossible ? [{ x: 635, y: 140, r: 18, vy: sawSpeed * 1.1 }] : [])
        ],
        fakeDoors: [], projectiles: [],
        update(s) {
          for (let saw of s.saws) {
            saw.y += saw.vy;
            if (saw.y > floorY - 24 || saw.y < 105) saw.vy *= -1;
          }
        }
      };
      break;
    }

    case 9: {
      // Escada com degraus de 64px de altura e distância horizontal curta (alcançável facilmente)
      const trueTop = r1 > 0.5;
      const topX = 355 + Math.floor(r2 * 70);
      baseLevel = {
        title: `FASE ${levelNum} [${diffCfg.name}]`,
        spawn: { x: 50, y: floorY - 40 },
        door: trueTop
          ? { x: topX + 36, y: floorY - 184, w: 34, h: 56, open: true }
          : { x: 700, y: floorY - 56, w: 34, h: 56, open: true },
        fakeDoors: [
          trueTop
            ? { x: 700, y: floorY - 56, w: 34, h: 56, open: true }
            : { x: topX + 36, y: floorY - 184, w: 34, h: 56, open: true }
        ],
        platforms: [
          { x: 0, y: floorY, w: 800, h: 450 - floorY },
          { x: topX - 145, y: floorY - 64, w: 115, h: 18 },
          { x: topX, y: floorY - 128, w: 115, h: 18 }
        ],
        spikes: isImpossible ? [{ x: 545, y: floorY - 20, w: 36, h: 20 }] : [],
        saws: [], projectiles: [],
        update(s) { if (rectHit(player, s.fakeDoors[0])) killPlayer(); }
      };
      break;
    }

    default: {
      const sp1X = Math.floor(215 + r1 * 60);
      const sp2X = Math.floor(445 + r2 * 75);
      baseLevel = {
        title: `FASE ${levelNum} [${diffCfg.name}]`,
        spawn: { x: 50, y: floorY - 40 },
        door: { x: 710, y: floorY - 56, w: 34, h: 56, jumped: false, open: true },
        platforms: [{ x: 0, y: floorY, w: 800, h: 450 - floorY }],
        spikes: isEasy ? [] : [
          { x: sp1X, y: floorY, w: 36, h: 20, active: false },
          ...((isHard || isImpossible) ? [{ x: sp2X, y: floorY, w: 36, h: 20, active: false }] : [])
        ],
        saws: isImpossible ? [{ x: 345, y: floorY - 98, r: 17, vy: 3.1 }] : [],
        fakeDoors: [], projectiles: [],
        update(s) {
          for (let sp of s.spikes) {
            if (player.x > sp.x - 85 && !player.grounded && !sp.active) { sp.active = true; playSound('trap'); }
            if (sp.active && sp.y > floorY - 20) sp.y -= 6;
          }
          if (!isEasy && player.x > 640 && !s.door.jumped) {
            s.door.jumped = true; s.door.y = floorY - 130;
            s.platforms.push({ x: 675, y: floorY - 74, w: 100, h: 18 });
            playSound('trap');
          }
          for (let saw of s.saws) {
            saw.y += saw.vy;
            if (saw.y > floorY - 30 || saw.y < floorY - 125) saw.vy *= -1;
          }
        }
      };
      break;
    }
  }

  if (hasChest) {
    baseLevel.chest = { x: 190 + Math.floor(r2 * 240), y: floorY - 28, w: 34, h: 28, opened: false };
  } else {
    baseLevel.chest = null;
  }

  return baseLevel;
}

function openMysteryChest(chest) {
  chest.opened = true;
  openedChests.push(currentLevel);
  localStorage.setItem('solaris_v4_chests', JSON.stringify(openedChests));
  playSound('charge');

  const roll = Math.random();
  let rewardType = 'coins';
  let title = '🌻 TESOURO DE GIRASSÓIS!';
  let subtitle = 'Você ganhou +75 Girassóis!';
  let color = '#ffd166';
  let wonSkinId = 0;

  if (roll < 0.10) {
    rewardType = 'token';
    title = 'TOKEN MESTRE SOLARIS! (10%)';
    subtitle = 'TODAS AS 10.000 SKINS LIBERADAS DE GRAÇA!';
    color = '#ffd666';
    hasMasterToken = true;
    localStorage.setItem('solaris_v4_token', 'true');
  } else if (roll < 0.30) {
    rewardType = 'mythic';
    wonSkinId = 9000 + Math.floor(Math.random() * 1000);
    const wonSkin = getSkinById(wonSkinId);
    title = `✨ SKIN MÍTICA ÚNICA! (20%)`;
    subtitle = `Você ganhou e equipou: ${wonSkin.name}!`;
    color = wonSkin.rarityColor;
    if (!ownedSkins.includes(wonSkinId)) {
      ownedSkins.push(wonSkinId);
      ownedSkins.sort((a, b) => a - b);
      localStorage.setItem('solaris_v4_owned', JSON.stringify(ownedSkins));
    }
    equippedSkinId = wonSkinId;
    localStorage.setItem('solaris_v4_skin', equippedSkinId);
  } else {
    sunflowers += 75;
    localStorage.setItem('solaris_v4_coins', sunflowers);
  }

  updateHUD();

  chestAnim = {
    active: true, timer: 0, maxTimer: 185,
    rewardType, title, subtitle, color, wonSkinId
  };
}

let level = null;

function loadLevel(idx) {
  level = getLevelData(idx);
  level.gravityDir = 1;
  player.x = level.spawn.x;
  player.y = level.spawn.y;
  player.vx = 0;
  player.vy = 0;
  player.grounded = false;
  player.wasGrounded = false;
  player.scaleX = 1;
  player.scaleY = 1;
  player.tilt = 0;
  deadTimer = 0;
  enterDoorTimer = 0;
  spawnAnimTimer = 22;
  jumpBuffer = 0;
  coyoteTime = 0;
  playerBullets = [];
  shootCooldown = 0;
  weaponRecoil = 0;
  muzzleFlashTimer = 0;
  particles = [];
  dustParticles = [];
  shockwaves = [];
  knockoutTimer = 0;
  bossBannerTimer = level.isBoss ? 75 : 0;

  shockwaves.push({ x: player.x + 11, y: player.y + 15, r: 4, color: '#ffa200', alpha: 0.9 });

  document.getElementById('statusText').textContent = level.title;
  updateHUD();
}

function killPlayer() {
  if (deadTimer > 0 || enterDoorTimer > 0 || chestAnim.active || knockoutTimer > 0) return;
  deaths++;
  localStorage.setItem('solaris_v4_deaths', deaths);
  deadTimer = 26;
  shakeTimer = 14;
  playSound('die');
  updateHUD();

  const skin = getActiveSkin();
  for (let i = 0; i < 24; i++) {
    particles.push({
      x: player.x + player.w / 2,
      y: player.y + player.h / 2,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.7) * 12,
      size: 4 + Math.random() * 5,
      color: i % 3 === 0 ? skin.accent : skin.suit,
      life: 26
    });
  }
}

function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function updateMap() {
  let move = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) move -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) move += 1;

  if (move !== 0) {
    mapPlayer.vx += (move * 4.8 - mapPlayer.vx) * 0.35;
    mapPlayer.facing = move;
    mapPlayer.walkFrame += 0.28;
  } else {
    mapPlayer.vx *= 0.72;
    mapPlayer.walkFrame = 0;
  }

  if ((keys['ArrowDown'] || keys['KeyS']) && mapPlayer.grounded && mapPlayer.y < 340) {
    mapPlayer.y += 16;
    mapPlayer.grounded = false;
  }

  mapPlayer.vy += 0.55;
  mapPlayer.x = Math.max(10, Math.min(canvas.width - 28, mapPlayer.x + mapPlayer.vx));
  mapPlayer.y += mapPlayer.vy;
  mapPlayer.grounded = false;

  for (let f of mapFloors) {
    if (mapPlayer.vy > 0 && mapPlayer.x + mapPlayer.w > f.x && mapPlayer.x < f.x + f.w &&
        mapPlayer.y + mapPlayer.h >= f.y && mapPlayer.y + mapPlayer.h - mapPlayer.vy <= f.y + 8) {
      mapPlayer.y = f.y - mapPlayer.h;
      mapPlayer.vy = 0;
      mapPlayer.grounded = true;
    }
  }
}

function updatePlaying() {
  if (bossBannerTimer > 0) bossBannerTimer--;
  if (knockoutTimer > 0) knockoutTimer--;
  if (spawnAnimTimer > 0) spawnAnimTimer--;
  if (shootCooldown > 0) shootCooldown--;
  if (weaponRecoil > 0) weaponRecoil *= 0.65;
  if (muzzleFlashTimer > 0) muzzleFlashTimer--;

  player.scaleX += (1 - player.scaleX) * 0.22;
  player.scaleY += (1 - player.scaleY) * 0.22;

  if (chestAnim.active) {
    chestAnim.timer++;
    if (chestAnim.timer === 42) {
      shakeTimer = 18;
      playSound('jackpot');
      shockwaves.push({ x: 400, y: 215, r: 10, color: chestAnim.color, alpha: 1 });
      for (let i = 0; i < 45; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 12;
        particles.push({
          x: 400, y: 215,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
          size: 4 + Math.random() * 5,
          color: i % 2 === 0 ? chestAnim.color : '#ffffff',
          life: 60
        });
      }
    }
    if (chestAnim.timer >= chestAnim.maxTimer) chestAnim.active = false;
    return;
  }

  if (enterDoorTimer > 0) {
    enterDoorTimer--;
    player.x += (level.door.x + 6 - player.x) * 0.24;
    player.y += (level.door.y + 20 - player.y) * 0.24;
    if (enterDoorTimer === 0) {
      const diffCfg = getDiffConfig();
      const reward = level.isBoss ? diffCfg.bossReward : diffCfg.normalReward;
      sunflowers += reward;
      localStorage.setItem('solaris_v4_coins', sunflowers);
      updateHUD();
      playSound('coin');
      spawnFloatingText(level.door.x + 15, level.door.y - 10, `+${reward} 🌻 (${diffCfg.name})`, diffCfg.border);

      if (currentLevel + 1 > unlockedLevel && currentLevel + 1 < TOTAL_LEVELS) {
        unlockedLevel = currentLevel + 1;
        localStorage.setItem('solaris_v4_unlocked', unlockedLevel);
      }
      if (currentLevel + 1 < TOTAL_LEVELS) {
        openDifficultySelect(currentLevel + 1);
      } else {
        screen = 'victory';
      }
    }
    return;
  }

  if (deadTimer > 0) {
    deadTimer--;
    if (deadTimer === 0) loadLevel(currentLevel);
    return;
  }

  if (level.isBoss && (keys['KeyJ'] || keys['KeyZ'] || keys['KeyX'] || keys['ShiftLeft'])) {
    fireSolarShot();
  }

  for (let b of playerBullets) {
    b.x += b.vx;
    b.y += b.vy;
    if (level.isBoss && level.boss && level.boss.hp > 0) {
      if (rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 }, level.boss)) {
        b.dead = true;
        level.boss.hp -= b.damage;
        level.boss.hurtTimer = 5;
        playSound('bosshit');
        if (particles.length < 70) {
          particles.push({
            x: b.x, y: b.y,
            vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 5,
            size: 4, color: b.color, life: 12
          });
        }
      }
    }
  }
  playerBullets = playerBullets.filter(b => !b.dead && b.x > -20 && b.x < 820 && b.y > -20 && b.y < 470);

  level.update(level);

  const gDir = level.gravityDir || 1;
  const inv = level.invertControls ? -1 : 1;

  let moveInput = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) moveInput -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) moveInput += 1;
  moveInput *= inv;

  if (moveInput !== 0) {
    player.vx += (moveInput * player.maxSpeed - player.vx) * 0.36;
    player.facing = moveInput;
    player.walkFrame += 0.30;
    player.tilt += (moveInput * 0.09 - player.tilt) * 0.25;
    if (player.grounded && dustParticles.length < 25 && Math.random() < 0.32) {
      dustParticles.push({ x: player.x + 10, y: gDir === 1 ? player.y + player.h : player.y, life: 13, r: 3 });
    }
  } else {
    player.vx *= 0.72;
    if (Math.abs(player.vx) < 0.1) player.vx = 0;
    player.walkFrame = 0;
    player.tilt += (0 - player.tilt) * 0.25;
  }

  if (player.grounded) coyoteTime = 6;
  else if (coyoteTime > 0) coyoteTime--;

  if (jumpBuffer > 0) jumpBuffer--;

  if (jumpBuffer > 0 && coyoteTime > 0) {
    player.vy = player.jumpForce * gDir;
    player.grounded = false;
    coyoteTime = 0;
    jumpBuffer = 0;
    player.scaleX = 0.74;
    player.scaleY = 1.28;
    playSound('jump');
    for (let i = 0; i < 5; i++) {
      dustParticles.push({
        x: player.x + 10 + (Math.random() - 0.5) * 12,
        y: gDir === 1 ? player.y + player.h : player.y,
        life: 14, r: 4
      });
    }
  }

  player.wasGrounded = player.grounded;
  player.vy += 0.58 * gDir;
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x + player.vx));

  for (let p of level.platforms) {
    if (rectHit(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  player.y += player.vy;
  player.grounded = false;

  for (let p of level.platforms) {
    if (rectHit(player, p)) {
      if (player.vy * gDir > 0) {
        if (!player.wasGrounded && Math.abs(player.vy) > 4) {
          player.scaleX = 1.26;
          player.scaleY = 0.76;
        }
        player.y = gDir === 1 ? p.y - player.h : p.y + p.h;
        player.vy = 0;
        player.grounded = true;
      } else if (player.vy * gDir < 0) {
        player.y = gDir === 1 ? p.y + p.h : p.y - player.h;
        player.vy = 0;
      }
    }
  }

  if (player.y > canvas.height + 30 || player.y < -60) { killPlayer(); return; }

  for (let s of level.spikes) {
    const hitbox = { x: s.x + 5, y: s.y + 5, w: s.w - 10, h: s.h - 5 };
    if (rectHit(player, hitbox)) { killPlayer(); return; }
  }

  for (let saw of level.saws) {
    const dx = (player.x + player.w / 2) - saw.x;
    const dy = (player.y + player.h / 2) - saw.y;
    if (Math.hypot(dx, dy) < saw.r + 7) { killPlayer(); return; }
  }

  if (level.chest && !level.chest.opened && rectHit(player, level.chest)) {
    openMysteryChest(level.chest);
  }

  if (level.door.open && rectHit(player, level.door)) {
    enterDoorTimer = 15;
    playSound('win');
  }
}

function update() {
  if (shakeTimer > 0) shakeTimer--;

  if (crateAnim.active) {
    crateAnim.timer++;
    if (crateAnim.timer < 95 && crateAnim.timer % 5 === 0) playSound('tick');
    if (crateAnim.timer === 95) {
      shakeTimer = 15;
      playSound('jackpot');
      const wonColor = crateAnim.mode === 'weapon'
        ? getWeaponById(crateAnim.finalId).rarityColor
        : getSkinById(crateAnim.finalId).rarityColor;
      shockwaves.push({ x: 400, y: 215, r: 10, color: wonColor, alpha: 1 });
      for (let i = 0; i < 45; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 12;
        particles.push({
          x: 400, y: 215,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
          size: 4 + Math.random() * 5,
          color: i % 2 === 0 ? wonColor : '#ffffff',
          life: 55
        });
      }
    }
    if (crateAnim.timer >= crateAnim.maxTimer) crateAnim.active = false;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.r += 11; sw.alpha *= 0.91;
    if (sw.alpha <= 0.04) shockwaves.splice(i, 1);
  }

  for (let i = dustParticles.length - 1; i >= 0; i--) {
    const d = dustParticles[i];
    d.life--; d.r *= 0.94;
    if (d.life <= 0) dustParticles.splice(i, 1);
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 1.1; ft.life--;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  if (screen === 'map') updateMap();
  else if (screen === 'playing') updatePlaying();
}

function drawSolarisBackground(lvlIdx = currentLevel) {
  const biome = getBiomeForLevel(lvlIdx);
  const isBoss = (screen === 'playing' && level && level.isBoss);
  renderBackgroundCache(biome, isBoss);
  ctx.drawImage(bgCache, 0, 0);
}

function drawDifficultyScreen() {
  drawSolarisBackground(pendingLevel);

  const isBoss = ((pendingLevel + 1) % 20 === 0);
  const biome = getBiomeForLevel(pendingLevel);

  ctx.fillStyle = C_SOLAR_DARK;
  ctx.fillRect(0, 0, canvas.width, 58);
  ctx.fillStyle = C_SOLAR_ACCENT;
  ctx.font = 'bold 20px "Arial Black", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(
    isBoss
      ? `☕ BOSS #${(pendingLevel + 1) / 20} — SELECIONE A DIFICULDADE`
      : `☀ FASE ${pendingLevel + 1} (${biome.name}) — SELECIONE A DIFICULDADE`,
    canvas.width / 2, 37
  );

  for (let i = 0; i < DIFFICULTIES.length; i++) {
    const d = DIFFICULTIES[i];
    const cx = 24 + i * 191;
    const cy = 108;
    const cw = 179;
    const ch = 268;

    ctx.fillStyle = C_SOLAR_DARK;
    ctx.fillRect(cx, cy, cw, ch);
    ctx.strokeStyle = d.border;
    ctx.lineWidth = 3.5;
    ctx.strokeRect(cx, cy, cw, ch);

    ctx.fillStyle = d.color;
    ctx.fillRect(cx + 3, cy + 3, cw - 6, 42);
    ctx.fillStyle = i === 3 ? '#ffffff' : '#140c09';
    ctx.font = 'bold 17px "Arial Black", sans-serif';
    ctx.fillText(d.name, cx + cw / 2, cy + 30);

    const winCoins = isBoss ? d.bossReward : d.normalReward;
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 16px "Arial Black", sans-serif';
    ctx.fillText(`+${winCoins} 🌻`, cx + cw / 2, cy + 84);

    ctx.fillStyle = '#adb5bd';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('Recompensa da Fase', cx + cw / 2, cy + 104);

    ctx.fillStyle = '#f8f9fa';
    ctx.font = '11.5px sans-serif';
    ctx.fillText(d.desc1, cx + cw / 2, cy + 145);
    ctx.fillText(d.desc2, cx + cw / 2, cy + 165);

    ctx.fillStyle = d.color;
    ctx.fillRect(cx + 16, cy + 212, cw - 32, 36);
    ctx.fillStyle = i === 3 ? '#ffffff' : '#140c09';
    ctx.font = 'bold 13px "Arial Black", sans-serif';
    ctx.fillText(`▶ JOGAR [${i + 1}]`, cx + cw / 2, cy + 235);
  }

  ctx.fillStyle = C_SOLAR_DARK;
  ctx.fillRect(310, 395, 180, 34);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px "Arial Black", sans-serif';
  ctx.fillText('◀ VOLTAR AO MAPA', 400, 417);
  ctx.textAlign = 'left';
}

function drawSolarPlatform(p, lvlIdx = currentLevel) {
  const biome = getBiomeForLevel(lvlIdx);
  ctx.fillStyle = biome.platBody;
  ctx.fillRect(p.x, p.y, p.w, p.h);

  const topH = Math.min(18, p.h);
  ctx.fillStyle = biome.platTop;
  ctx.fillRect(p.x + 2, p.y + 2, p.w - 4, topH - 2);

  ctx.fillStyle = biome.platTrim;
  ctx.fillRect(p.x, p.y, p.w, 3);

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let gx = p.x + 24; gx < p.x + p.w - 6; gx += 24) {
    ctx.moveTo(gx, p.y + 3);
    ctx.lineTo(gx, p.y + topH);
  }
  ctx.stroke();
}

function drawMysteryChest(ch) {
  if (!ch) return;
  ctx.save();
  const bounce = ch.opened ? 0 : Math.abs(Math.sin(Date.now() / 220)) * 3;
  ctx.translate(ch.x, ch.y - bounce);

  if (!ch.opened) {
    ctx.fillStyle = 'rgba(255, 214, 102, 0.35)';
    ctx.fillRect(-5, -5, ch.w + 10, ch.h + 10);
  }

  ctx.fillStyle = ch.opened ? '#5c3a21' : '#8c3419';
  ctx.fillRect(0, 8, ch.w, ch.h - 8);
  ctx.fillStyle = ch.opened ? '#3d2a22' : '#b84a27';
  ctx.fillRect(-2, ch.opened ? -4 : 0, ch.w + 4, 10);
  ctx.strokeStyle = '#ffd166';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, ch.w, ch.h);
  ctx.fillStyle = '#ffd166';
  ctx.fillRect(ch.w / 2 - 4, 8, 8, 9);

  ctx.restore();
}

function drawChestOpeningCinematic() {
  if (!chestAnim.active) return;
  const t = chestAnim.timer;

  const fadeAlpha = Math.min(0.86, t / 15);
  ctx.fillStyle = `rgba(14, 8, 5, ${fadeAlpha})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let sw of shockwaves) {
    ctx.save();
    ctx.strokeStyle = sw.color;
    ctx.globalAlpha = sw.alpha;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  if (t < 42) {
    const scale = 1.4 + (t / 42) * 1.8;
    const shakeX = (Math.random() - 0.5) * (t * 0.45);
    const shakeY = (Math.random() - 0.5) * (t * 0.45);

    ctx.save();
    ctx.translate(400 + shakeX, 225 + shakeY);
    ctx.scale(scale, scale);

    ctx.fillStyle = '#8c3419';
    ctx.fillRect(-17, -6, 34, 20);
    ctx.fillStyle = '#b84a27';
    ctx.fillRect(-19, -14, 38, 10);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2;
    ctx.strokeRect(-17, -14, 34, 28);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(-4, -6, 8, 9);
    ctx.restore();
  } else {
    const revealT = t - 42;
    const popScale = Math.min(1, revealT / 14) * (1 + Math.sin(revealT * 0.25) * 0.05);

    ctx.save();
    ctx.translate(400, 195);
    ctx.scale(popScale, popScale);

    if (chestAnim.rewardType === 'token') {
      drawSolarisToken(0, 0, 68, Math.sin(revealT * 0.06) * 0.22);
    } else if (chestAnim.rewardType === 'mythic') {
      const wonSkin = getSkinById(chestAnim.wonSkinId);
      drawSolarisCharacter(-11, -15, 22, 30, revealT * 0.3, true, Math.sin(revealT * 0.15) >= 0 ? 1 : -1, 1, 3.0, 3.0, 0, wonSkin, false);
    } else {
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C_SOLAR_DARK;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.fillStyle = chestAnim.color;
    ctx.font = 'bold 26px "Arial Black", sans-serif';
    ctx.fillText(chestAnim.title, 400, 315);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText(chestAnim.subtitle, 400, 348);

    if (revealT > 25) {
      ctx.fillStyle = '#d6c3b3';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('Aperte [ESPAÇO] ou clique para continuar', 400, 395);
    }
    ctx.textAlign = 'left';
  }
}

function drawSolarisCharacter(px, py, w, h, walkFrame, grounded, facing = 1, gDir = 1, sx = 1, sy = 1, tilt = 0, customSkin = null, showWeapon = false) {
  const skin = customSkin || getActiveSkin();
  const isBlinking = (Date.now() % 3200) < 120;
  const idleBreath = grounded && walkFrame === 0 ? Math.sin(Date.now() / 220) * 0.7 : 0;

  ctx.save();
  ctx.translate(px + w / 2, py + h);
  ctx.rotate(tilt);
  ctx.scale(sx, sy * gDir);

  const floatOffset = skin.shape === 'floating' ? Math.sin(Date.now() / 150) * 2.5 : 0;
  ctx.translate(-w / 2, -h + floatOffset + idleBreath);

  if (skin.rarity === 'MÍTICA' || skin.rarity === 'LENDÁRIA') {
    ctx.fillStyle = skin.rarity === 'MÍTICA' ? 'rgba(255, 0, 127, 0.22)' : 'rgba(255, 209, 102, 0.22)';
    ctx.beginPath();
    ctx.arc(w / 2, h / 2, 19, 0, Math.PI * 2);
    ctx.fill();
  }

  const wave = Math.sin(Date.now() / 90) * 2;
  if (skin.back === 'scarf' || skin.back === 'cape') {
    ctx.fillStyle = skin.accent;
    const capeH = skin.back === 'cape' ? 12 : 5;
    if (facing === 1) {
      ctx.fillRect(-5, 9 + wave, 7, capeH);
      ctx.fillRect(-8, 12 - wave, 5, capeH - 2);
    } else {
      ctx.fillRect(w - 2, 9 + wave, 7, capeH);
      ctx.fillRect(w + 3, 12 - wave, 5, capeH - 2);
    }
  } else if (skin.back === 'wings') {
    ctx.fillStyle = skin.accent;
    const flap = Math.sin(Date.now() / 110) * 4;
    ctx.beginPath();
    if (facing === 1) {
      ctx.moveTo(4, 11); ctx.lineTo(-9, 3 + flap); ctx.lineTo(-5, 17);
    } else {
      ctx.moveTo(w - 4, 11); ctx.lineTo(w + 9, 3 + flap); ctx.lineTo(w + 5, 17);
    }
    ctx.fill();
  } else if (skin.back === 'jetpack') {
    ctx.fillStyle = '#adb5bd';
    ctx.fillRect(facing === 1 ? -3 : w - 2, 9, 5, 11);
    ctx.fillStyle = '#ff5400';
    ctx.fillRect(facing === 1 ? -2 : w - 1, 20, 3, 3 + Math.random() * 4);
  }

  let headX = 5, headW = 12, bodyX = 3, bodyW = 16;
  if (skin.shape === 'heavy') {
    headX = 3; headW = 16; bodyX = 1; bodyW = 20;
  } else if (skin.shape === 'agile') {
    headX = 6; headW = 10; bodyX = 5; bodyW = 12;
  }

  ctx.fillStyle = skin.suit;
  if (skin.shape === 'mech') {
    ctx.fillRect(bodyX - 1, 9, bodyW + 2, 13);
    ctx.strokeStyle = skin.accent;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bodyX - 1, 9, bodyW + 2, 13);
  } else {
    ctx.fillRect(bodyX, 9, bodyW, 13);
  }

  ctx.fillStyle = skin.accent;
  ctx.fillRect(w / 2 - 2, 12, 4, 5);

  ctx.fillStyle = skin.skinTone;
  ctx.fillRect(headX, 0, headW, 9);

  if (!isBlinking) {
    if (skin.face === 'visor') {
      ctx.fillStyle = skin.accent;
      ctx.fillRect(facing === 1 ? headX + headW - 6 : headX + 1, 3, 5, 3);
    } else if (skin.face === 'eyes') {
      ctx.fillStyle = '#ffffff';
      const ex = facing === 1 ? headX + headW - 7 : headX + 1;
      ctx.fillRect(ex, 3, 2, 3);
      ctx.fillRect(ex + 4, 3, 2, 3);
    } else if (skin.face === 'glasses') {
      ctx.fillStyle = '#111111';
      const gx = facing === 1 ? headX + headW - 7 : headX;
      ctx.fillRect(gx, 2, 7, 3);
      ctx.fillStyle = skin.accent;
      ctx.fillRect(gx + 1, 3, 2, 1);
      ctx.fillRect(gx + 4, 3, 2, 1);
    } else if (skin.face === 'cyclops') {
      ctx.fillStyle = skin.accent;
      ctx.fillRect(facing === 1 ? headX + headW - 5 : headX + 2, 2, 3, 4);
    } else if (skin.face === 'mask') {
      ctx.fillStyle = skin.suit;
      ctx.fillRect(headX, 4, headW, 5);
      ctx.fillStyle = skin.accent;
      ctx.fillRect(facing === 1 ? headX + headW - 5 : headX + 2, 2, 3, 2);
    } else {
      ctx.fillStyle = skin.accent;
      ctx.fillRect(facing === 1 ? headX + headW - 6 : headX + 1, 3, 5, 2);
    }
  }

  if (skin.hat === 'cap') {
    ctx.fillStyle = skin.suit;
    ctx.fillRect(headX, 0, headW, 2);
    ctx.fillRect(facing === 1 ? headX + 2 : headX - 3, 1, headW + 1, 2);
  } else if (skin.hat === 'band') {
    ctx.fillStyle = skin.accent;
    ctx.fillRect(headX - 1, 1, headW + 2, 2);
  } else if (skin.hat === 'crown') {
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.moveTo(headX, 0); ctx.lineTo(headX, -5); ctx.lineTo(headX + headW * 0.25, -2);
    ctx.lineTo(headX + headW * 0.5, -6); ctx.lineTo(headX + headW * 0.75, -2); ctx.lineTo(headX + headW, -5);
    ctx.lineTo(headX + headW, 0); ctx.fill();
  } else if (skin.hat === 'flower') {
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(w / 2, -2, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d2a22';
    ctx.beginPath(); ctx.arc(w / 2, -2, 2.5, 0, Math.PI * 2); ctx.fill();
  } else if (skin.hat === 'helmet') {
    ctx.strokeStyle = '#e5e5e5';
    ctx.lineWidth = 2;
    ctx.strokeRect(headX - 2, -1, headW + 4, 11);
  } else if (skin.hat === 'halo') {
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(w / 2, -5, 7, 2.3, 0, 0, Math.PI * 2); ctx.stroke();
  } else if (skin.hat === 'antenna') {
    ctx.fillStyle = skin.accent;
    ctx.fillRect(w / 2 - 1, -6, 2, 6);
    ctx.beginPath(); ctx.arc(w / 2, -7, 2.5, 0, Math.PI * 2); ctx.fill();
  } else if (skin.hat === 'horns') {
    ctx.fillStyle = skin.accent;
    ctx.beginPath(); ctx.moveTo(headX, 0); ctx.lineTo(headX - 2, -5); ctx.lineTo(headX + 3, 0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(headX + headW, 0); ctx.lineTo(headX + headW + 2, -5); ctx.lineTo(headX + headW - 3, 0); ctx.fill();
  } else if (skin.hat === 'hood') {
    ctx.fillStyle = skin.suit;
    ctx.fillRect(headX - 1, -1, headW + 2, 3);
    ctx.fillRect(facing === 1 ? headX - 1 : headX + headW - 1, 0, 2, 9);
  }

  ctx.fillStyle = skin.suit;
  if (skin.shape === 'floating') {
    ctx.beginPath();
    ctx.moveTo(bodyX, 22);
    ctx.lineTo(w / 2, 29 + Math.sin(Date.now() / 100) * 2);
    ctx.lineTo(bodyX + bodyW, 22);
    ctx.fill();
  } else {
    const step = Math.sin(walkFrame) * 4;
    if (!grounded) {
      ctx.fillRect(1, 22, 8, 6);
      ctx.fillRect(13, 20, 7, 8);
    } else if (Math.abs(step) > 0.4) {
      ctx.fillRect(2 + step, 22, 7, 8);
      ctx.fillRect(13 - step, 22, 7, 8);
    } else {
      ctx.fillRect(4, 22, 6, 8);
      ctx.fillRect(12, 22, 6, 8);
    }
  }

  if (showWeapon) {
    const activeWep = getActiveWeapon();
    const gunX = facing === 1 ? w - 2 : 2;
    const gunY = 15;
    drawWeaponSprite(activeWep, gunX, gunY, facing, 1.05, weaponRecoil, muzzleFlashTimer);
  }

  ctx.restore();
}

function drawDoor(d) {
  if (!d.open) return;
  const pulse = Math.sin(Date.now() / 180) * 2;
  ctx.fillStyle = C_SOLAR_DARK;
  ctx.fillRect(d.x - 4, d.y - 4, d.w + 8, d.h + 4);
  ctx.fillStyle = '#140e0c';
  ctx.fillRect(d.x, d.y, d.w, d.h);

  ctx.strokeStyle = 'rgba(255, 162, 0, 0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(d.x + d.w / 2, d.y + 22, 10 + pulse, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = C_SOLAR_ACCENT;
  ctx.beginPath();
  ctx.arc(d.x + d.w / 2, d.y + 22, 5 + pulse * 0.6, 0, Math.PI * 2);
  ctx.fill();
}

function drawCupheadBoss(b) {
  if (!b || b.hp <= 0) return;

  ctx.save();
  const barW = 340;
  const barX = (canvas.width - barW) / 2;
  ctx.fillStyle = C_SOLAR_DARK;
  ctx.fillRect(barX - 4, 14, barW + 8, 24);
  ctx.fillStyle = '#2b0000';
  ctx.fillRect(barX, 18, barW, 16);

  ctx.fillStyle = b.phase === 3 ? '#ff0055' : (b.phase === 2 ? '#ff7b00' : '#ffd166');
  ctx.fillRect(barX, 18, Math.max(0, (b.hp / b.maxHp) * barW), 16);

  ctx.fillStyle = '#140c09';
  ctx.fillRect(barX + barW * 0.65, 18, 3, 16);
  ctx.fillRect(barX + barW * 0.30, 18, 3, 16);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px "Arial Black", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${b.name} — FASE ${b.phase}/3 (ATIRE COM [J] OU CLIQUE!)`, canvas.width / 2, 30);
  ctx.textAlign = 'left';

  const squash = Math.sin(Date.now() / 95) * 4;
  const bx = b.x - squash / 2;
  const by = b.y + squash / 2;
  const bw = b.w + squash;
  const bh = b.h - squash;

  if (b.phase >= 2) {
    ctx.fillStyle = b.phase === 3 ? 'rgba(255, 0, 85, 0.28)' : 'rgba(255, 123, 0, 0.22)';
    ctx.beginPath();
    ctx.arc(bx + bw / 2, by + bh / 2, bw * 0.72 + Math.sin(Date.now() / 80) * 4, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = b.hurtTimer > 0 ? '#ffffff' : (b.phase === 3 ? '#7209b7' : b.color);
  ctx.beginPath();
  ctx.roundRect(bx, by + 10, bw, bh - 10, 18);
  ctx.fill();
  ctx.strokeStyle = b.phase === 3 ? '#ff007f' : C_SOLAR_ACCENT;
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = C_DANGER;
  ctx.beginPath();
  ctx.moveTo(bx + 8, by + 14);
  ctx.lineTo(bx - 12, by - 8 - squash);
  ctx.lineTo(bx + 24, by + 12);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(bx + bw - 8, by + 14);
  ctx.lineTo(bx + bw + 12, by - 8 - squash);
  ctx.lineTo(bx + bw - 24, by + 12);
  ctx.fill();

  const lookDir = player.x < bx + bw / 2 ? -3 : 3;
  ctx.fillStyle = '#fff8e7';
  ctx.beginPath();
  ctx.ellipse(bx + bw * 0.34, by + bh * 0.42, 11, 14, 0, 0, Math.PI * 2);
  ctx.ellipse(bx + bw * 0.66, by + bh * 0.42, 11, 14, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = b.phase === 3 ? '#d90429' : '#140c09';
  ctx.beginPath();
  ctx.arc(bx + bw * 0.34 + lookDir, by + bh * 0.43, 5.5, 0.2, Math.PI * 1.85);
  ctx.lineTo(bx + bw * 0.34 + lookDir, by + bh * 0.43);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(bx + bw * 0.66 + lookDir, by + bh * 0.43, 5.5, 0.2, Math.PI * 1.85);
  ctx.lineTo(bx + bw * 0.66 + lookDir, by + bh * 0.43);
  ctx.fill();

  ctx.strokeStyle = '#140c09';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(bx + bw * 0.20, by + bh * 0.26);
  ctx.lineTo(bx + bw * 0.46, by + bh * 0.34);
  ctx.moveTo(bx + bw * 0.80, by + bh * 0.26);
  ctx.lineTo(bx + bw * 0.54, by + bh * 0.34);
  ctx.stroke();

  ctx.fillStyle = '#330000';
  ctx.beginPath();
  ctx.ellipse(bx + bw / 2, by + bh * 0.72, 18 + b.phase * 3, 10 + b.phase * 2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(bx + bw / 2 - 10, by + bh * 0.64, 6, 5);
  ctx.fillRect(bx + bw / 2 + 4, by + bh * 0.64, 6, 5);

  ctx.restore();
}
